y:flex; align-items:center; justify-content:center;\n    font-family:-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Pretendard\",sans-serif;\n    overflow:hidden;\n  }\n  #doneBtn {\n    position:relative;\n    width:160px; height:56px;\n    border:0; border-radius:28px;\n    background:var(--btn); color:var(--fg);\n    font-size:18px; font-weight:700;\n    cursor:pointer;\n    transition:width .3s ease, background-color .3s ease, transform .15s ease;\n  }\n  #doneBtn:active { transform:scale(.96); }\n  #doneBtn.is-done { width:56px; background:var(--done); cursor:default; }\n  #doneBtn .label, #doneBtn .check {\n    position:absolute; inset:0;\n    display:flex; align-items:center; justify-content:center;\n    transition:opacity .2s ease, transform .3s ease;\n  }\n  #doneBtn .check { opacity:0; transform:scale(.4); }\n  #doneBtn.is-done .label { opacity:0; }\n  #doneBtn.is-done .check { opacity:1; transform:scale(1); }\n  #confetti { position:fixed; inset:0; pointer-events:none; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cbutton id=\"doneBtn\" type=\"button\" aria-label=\"완료\">\n    \u003cspan class=\"label\">완료\u003c/span>\n    \u003cspan class=\"check\" aria-hidden=\"true\">\n      \u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12.5l4.5 4.5L19 7.5\"/>\u003c/svg>\n    \u003c/span>\n  \u003c/button>\n  \u003ccanvas id=\"confetti\">\u003c/canvas>\n\n\u003cscript>\n  const P = PARAMS({ count: 60, speedMax: 700, gravity: 1400, drag: 0.985, life: 2, doneColor: \"#3cc8a0\" });\n  const COLORS = ['#ff6f86','#ff9f43','#3cc8a0','#5aa9ff','#f6c945','#fbe39a'];\n\n  const btn = document.getElementById('doneBtn');\n  const canvas = document.getElementById('confetti');\n  const ctx = canvas.getContext('2d');\n  let pieces = [];\n  let running = false;\n\n  function resize() {\n    const dpr = window.devicePixelRatio || 1;\n    canvas.width = innerWidth * dpr;\n    canvas.height = innerHeight * dpr;\n    canvas.style.width = innerWidth + 'px';\n    canvas.style.height = innerHeight + 'px';\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n  }\n  addEventListener('resize', resize);\n  resize();\n\n  function burst(x, y) {\n    const now = performance.now();\n    for (let i = 0; i \u003c P.count; i++) {\n      const angle = Math.random() * Math.PI * 2;\n      const speed = 250 + Math.random() * Math.max(0, P.speedMax - 250);\n      pieces.push({\n        x, y,\n        vx: Math.cos(angle) * speed,\n        vy: Math.sin(angle) * speed - 200,\n        w: 6 + Math.random() * 6,\n        h: 8 + Math.random() * 8,\n        rot: Math.random() * Math.PI * 2,\n        vr: (Math.random() - 0.5) * 12,\n        color: COLORS[i % COLORS.length],\n        born: now\n      });\n    }\n    if (!running) { running = true; requestAnimationFrame(tick); }\n  }\n\n  let last = performance.now();\n  function tick(now) {\n    const dt = Math.min((now - last) / 1000, 0.05);\n    last = now;\n    ctx.clearRect(0, 0, innerWidth, innerHeight);\n\n    pieces = pieces.filter(p => now - p.born \u003c P.life * 1000);\n    for (const p of pieces) {\n      const t = (now - p.born) / (P.life * 1000);\n      p.vx *= P.drag;\n      p.vy = p.vy * P.drag + P.gravity * dt;\n      p.x += p.vx * dt;\n      p.y += p.vy * dt;\n      p.rot += p.vr * dt;\n\n      ctx.save();\n      ctx.globalAlpha = 1 - t;\n      ctx.translate(p.x, p.y);\n      ctx.rotate(p.rot);\n      ctx.scale(1, Math.cos(p.rot * 2));\n      ctx.fillStyle = p.color;\n      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);\n      ctx.restore();\n    }\n\n    if (pieces.length) requestAnimationFrame(tick);\n    else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }\n  }\n\n  btn.addEventListener('click', () => {\n    if (btn.classList.contains('is-done')) return;\n    const r = btn.getBoundingClientRect();\n    last = performance.now();\n    burst(r.left + r.width / 2, r.top + r.height / 2);\n    btn.classList.add('is-done');\n    btn.setAttribute('aria-label', '완료됨');\n  });\n  function paint(){ document.documentElement.style.setProperty('--done', P.doneColor); }\n  paint();\n  // 값을 바꾸면 다시 시험할 수 있도록 버튼을 처음 상태로 되돌림\n  onParams(() => { paint(); btn.classList.remove('is-done'); btn.setAttribute('aria-label', '완료'); });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "93": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>보상 상자\u003c/title>\n\u003cstyle>\nhtml,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 70%,var(--t-accent-soft) 0%,var(--t-bg) 70%);font-family:-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Noto Sans KR\",sans-serif;user-select:none;-webkit-user-select:none}\n.scene{position:absolute;left:50%;top:50%;width:720px;height:420px;margin:-210px 0 0 -360px}\n.floor{position:absolute;left:50%;bottom:20px;width:260px;height:26px;margin-left:-130px;border-radius:50%;background:rgba(20,16,50,.3);filter:blur(4px)}\n:root[data-theme=\"dark\"] .floor{background:rgba(0,0,0,.45)}\n.rays{position:absolute;left:50%;top:285px;width:820px;height:820px;margin:-410px 0 0 -410px;opacity:0;transform:scale(0);transition:transform .7s cubic-bezier(.2,1,.3,1),opacity .4s;pointer-events:none;z-index:1}\n.rr{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(245,181,67,.5) 0deg 7deg,rgba(245,181,67,0) 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 0 12%,transparent 62%);mask:radial-gradient(circle,#000 0 12%,transparent 62%);animation:spin var(--spin,14s) linear infinite}\n@keyframes spin{to{transform:rotate(360deg)}}\n.glow{position:absolute;left:50%;top:285px;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,180, ;\nfunction fit(){const s=Math.min(innerWidth/720,innerHeight/420);scene.style.transform=`scale(${s})`}\nfunction css(){const r=document.documentElement.style;r.setProperty('--sa',P.shakeAng+'deg');r.setProperty('--sd',P.shakeDur+'s');r.setProperty('--cd',P.cardDur+'s');r.setProperty('--st',P.stagger+'s');r.setProperty('--sp',P.spread);r.setProperty('--spin',P.spin+'s');}\naddEventListener('resize',fit);fit();css();onParams(css);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "94": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>스크랩 콜라주\u003c/title>\n\u003cstyle>\nhtml,body{margin:0;background:var(--t-bg);height:100%;overflow:hidden}\nbody{font-family:-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Noto Sans KR\",sans-serif;color:var(--t-ink);display:flex;flex-direction:column;justify-content:center}\n.intro{height:100vh;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}\n.intro h1{margin:0;font-size:46px;font-weight:900;letter-spacing:-.03em}\n.intro p{margin:0;font-size:13px;color:#8b8172}\n.intro .ar{width:12px;height:12px;border-right:2px solid #8b8172;border-bottom:2px solid #8b8172;transform:rotate(45deg);margin-top:8px;animation:bob 1.4s ease-in-out infinite}\n@keyframes bob{50%{transform:translateY(6px) rotate(45deg)}}\n.board{position:relative;width:100%;height:100%;max-height:480px;max-width:760px;margin:0 auto;background-image:radial-gradient(var(--t-line) 1px,transparent 1.5px);background-size:16px 16px}\n.end{height:140px}\n.pc{position:absolute;opacity:0;transform-origin:50% 50%;color:#2b2620}\n.board.on .pc{animation:stick var(--dur,.3s) cubic-bezier(.3,1.45,.5,1) forwards;animation-delay:calc(var(--i) * var(--gap,.15s))}\n@keyframes stick{0%{opacity:0;transform:translateY(calc(-1px * var(--lift,26))) scale(var(--ps, ept=\"audio/*\" hidden>\n  \u003cdiv id=\"msg\">소리를 하나 골라 틀어 보세요.\u003c/div>\n\u003c/div>\n\n\u003cscript>\nconst P = PARAMS({ bars: 48, fall: 0.3, minH: 4, gap: 4, areaH: 60, color: \"#f6c945\" });\nconst BAR_COUNT = P.bars;\n\nconst barsEl = document.getElementById('bars');\nconst bars = [];\nfor (let i = 0; i \u003c BAR_COUNT; i++) {\n  const b = document.createElement('div');\n  b.className = 'bar';\n  b.style.height = P.minH + 'px';\n  barsEl.appendChild(b);\n  bars.push(b);\n}\nconst levels = new Float32Array(BAR_COUNT);\n\nlet analyser, freqData, ranges, lastT = 0, running = false;\n\nlet ctx = null, current = null, speaker = null;\nconst msg = document.getElementById('msg');\nfunction getCtx() {\n  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();\n  return ctx;\n}\nfunction setupAnalyser() {\n  if (analyser) return;\n  analyser = ctx.createAnalyser();\n  analyser.fftSize = 2048;\n  analyser.smoothingTimeConstant = 0;\n  analyser.minDecibels = -90;\n  analyser.maxDecibels = -20;\n  freqData = new Uint8Array(analyser.frequencyBinCount);\n  const nyq = ctx.sampleRate / 2, binHz = nyq / analyser.frequencyBinCount;\n  const fMin = 80, fMax = Math.min(8000, nyq);\n  ranges = [];\n  for (let i = 0; i \u003c BAR_COUNT; i++) {\n    const f0 = fMin * Math.pow(fMax / fMin, i / BAR_COUNT);\n    const f1 = fMin * Math.pow(fMax / fMin, (i + 1) / BAR_COUNT);\n    const a = Math.floor(f0 / binHz);\n    const b = Math.max(a + 1, Math.ceil(f1 / binHz));\n    ranges.push([a, b]);\n  }\n  speaker = ctx.createGain(); speaker.gain.value = 0.6; speaker.connect(ctx.destination);\n  running = true; lastT = performance.now(); requestAnimationFrame(tick);\n}\nfunction stopCurrent() {\n  if (!current) return;\n  try { current.stop(); } catch (e) {}\n  current = null;\n  document.querySelectorAll('button').forEach(b => b.classList.remove('on'));\n}\nfunction mark(id) { document.getElementById(id).classList.add('on'); }\n\nlet sampleTimer = null;\nfunction playSa <script>
(function(){
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const SPECS = DATA.specs, DEMOS = DATA.demos, LIBS = DATA.libs, RUNTIME = DATA.runtime;
const SLOTS = ['오브젝트','트리거','반응','조건','변수'];
const SECTIONS = DATA.sections; // [{from,to,title}]
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const SAVE_KEY = 'cat97adv:v1';
const saved = store.get(SAVE_KEY) || {};
const nn = n => String(n).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const toastEl = document.getElementById('toast'); let toastT;
function toast(m){ toastEl.textContent=m; toastEl.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),1600); }
async function copy(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    ta.remove(); toast(ok?okMsg:'복사가 막혀 있어요. 텍스트 편집으로 직접 선택해 주세요');
  }
}
function decimals(step){ const s=String(step); return s.includes('.')? s.split('.')[1].length : 0; }
function fmt(p, v){
  if (p.type==='select' || p.type==='color') return String(v);
  if (p.type==='toggle') return v ? (p.on||'켜짐') : (p.off||'꺼짐');
  return String(+Number(v).toFixed(decimals(p.step||1)));
}
const ICON = '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0l1.6 5.1L15 3.4 11 8l4 4.6-5.4-1.7L8 16l-1.6-5.1L1 12.6 5 8 1 3.4l5.4 1.7z"/></svg>';

/* ---------- state ---------- */
const S = {};
SPECS.forEach(sp => {
  const def = {}; sp.params.forEach(p => def[p.key]=p.value);
  const sv = saved[sp.n] || {};
  const vals = Object.assign({}, def);
  if (sv.v) for (const k in sv.v) if (k in def) vals[k]=sv.v[k];
  S[sp.n] = { sp, def, vals, text: Object.assign({}, sp.slots, sv.t||{}), dirty:false, frame:null, loaded:false };
});

/* ---------- render ---------- */
const main = document.getElementById('main'), jump = document.getElementById('jump');
function slotHTML(st, slot){
  const tpl = st.text[slot];
  const byKey = {}; st.sp.params.forEach(p=>byKey[p.key]=p);
  return esc(tpl).replace(/\{(\w+)\}/g, (m,k) => {
    const p = byKey[k]; if(!p) return m;
    const sw = p.type==='color' ? `<span class="sw" style="background:${esc(st.vals[k])}"></span>` : '';
    return `<span class="v${st.vals[k]!==st.def[k]?' changed':''}" contenteditable="false" data-k="${k}" title="${esc(p.label)}">${sw}${esc(fmt(p, st.vals[k]))}</span>`;
  });
}
function ctlHTML(n, p, v){
  const id = `c${n}-${p.key}`;
  const lab = `<label for="${id}">${esc(p.label)}${p.live===false?'<small>다시 재생</small>':''}</label>`;
  if (p.type==='select') return `<div class="ctl" data-k="${p.key}">${lab}<select id="${id}">${p.options.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  if (p.type==='color') return `<div class="ctl" data-k="${p.key}">${lab}<span class="colorbox"><input type="color" id="${id}" value="${esc(v)}"><span class="hex">${esc(v)}</span></span></div>`;
  if (p.type==='toggle') return `<div class="ctl" data-k="${p.key}">${lab}<button type="button" class="tg" id="${id}" aria-pressed="${!!v}"><span class="sr" hidden>${esc(p.label)}</span></button></div>`;
  return `<div class="ctl" data-k="${p.key}">${lab}<input type="range" id="${id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${v}"><input class="num" type="number" id="${id}-n" aria-label="${esc(p.label)} 값" min="${p.min}" max="${p.max}" step="${p.step}" value="${fmt(p,v)}"></div>`;
}
function itemHTML(st){
  const sp = st.sp, n = sp.n, wide = n >= 47;
  const ctrlsHTML = `<div class="ctrls">
        <div class="ctrls-t"><span>조절 변수</span><span class="live-n">${sp.params.length}개</span></div>
        <div class="ctl-grid">${sp.params.map(p=>ctlHTML(n,p,st.vals[p.key])).join('')}</div>
      </div>
      <div class="acts"><button type="button" class="btn pri" data-act="apply" disabled>적용하기</button><button type="button" class="btn" data-act="reset">기본값으로 되돌리기</button><span class="msg">적용했어요</span></div>`;
  return `<article class="item${wide?' wide':''}" id="n${nn(n)}" data-n="${n}">
  <div class="ihead"><span class="no">${nn(n)}</span><h3>${esc(sp.title)} ${sp.en?`<em>(${esc(sp.en)})</em>`:''}</h3>
    </div>
  <div class="ibody">
    <section class="spec" aria-label="명세서">
      <div class="spec-t">${ICON}명세서</div>
      <div class="rows">${SLOTS.map(s=>`<div class="row"><div class="lab">${s}</div><div class="txt" data-slot="${s}">${slotHTML(st,s)}</div></div>`).join('')}</div>
      ${wide?'':ctrlsHTML}
    </section>
    <section class="live" aria-label="라이브 데모">
      <div class="ltools"><button type="button" data-act="copy">편집 내용 복사</button><button type="button" data-act="edit" aria-pressed="false">텍스트 편집</button><button type="button" data-act="copyall">명세서 전체 복사</button></div>
      <div class="frame" style="--h:${sp.h||400}px"><div class="ph">불러오는 중…</div></div>
      <div class="lfoot"><span><span class="dot"></span>${esc(sp.hint||'직접 만져 보세요')}</span><button type="button" data-act="replay">다시 재생 ↻</button></div>
    </section>
  </div>${wide?`<div class="below">${ctrlsHTML}</div>`:''}</article>`;
}
let html=''; let curPart=0;
SECTIONS.forEach(sec => {
  const part = sec.from<=51?1:2;
  if (part!==curPart){ curPart=part; html += `<div class="part-h" data-part="${part}"><h2>${part===1?'1부 · 인터랙션':'2부 · 모션'}</h2><span>${part===1?'#01–51':'#52–97'}</span></div>`; }
  html += `<div class="sec" data-from="${sec.from}"><div class="sec-h">${esc(sec.title)}</div><div class="list">`;
  SPECS.filter(sp=>sec.nums.includes(sp.n)).forEach(sp=> html += itemHTML(S[sp.n]));
  html += `</div></div>`;
});
main.innerHTML = html;
jump.innerHTML = SPECS.map(sp=>`<a href="#n${nn(sp.n)}" class="${sp.n<=46?'req':''}" data-n="${sp.n}">${nn(sp.n)}</a>`).join('');
SPECS.forEach(sp=>{ const st=S[sp.n]; st.el=document.getElementById('n'+nn(sp.n)); markMod(st); });

/* ---------- demo frames ---------- */
const mq = matchMedia('(prefers-color-scheme: dark)');
function curTheme(){ return 'dark'; }
let lastTheme = curTheme();
function themeChanged(){ const t=curTheme(); if(t===lastTheme) return; lastTheme=t;
  SPECS.forEach(sp=>{ const st=S[sp.n]; if(st.frame&&st.frame.contentWindow) st.frame.contentWindow.postMessage({type:'theme',theme:t},'*'); }); }
mq.addEventListener('change', themeChanged);
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function buildDoc(st){
  const src = DEMOS[nn(st.sp.n)];
  const m = src.match(/<meta\s+name="libs"\s+content="([^"]*)"/);
  const libs = m ? m[1].split(',').map(s=>s.trim()).filter(Boolean) : [];
  const inj = `<style id="__tokens">${DATA.tokens}</style><script>window.__P=${JSON.stringify(st.vals).replace(/</g,'\\u003c')};window.__THEME="${curTheme()}";<\/script><script>${RUNTIME}<\/script>` + libs.map(l=>`<script>${LIBS[l]}<\/script>`).join('');
  return src.replace(/<head[^>]*>/i, h => h + inj);
}
function load(st){
  const fr = st.el.querySelector('.frame');
  if (st.frame) st.frame.remove();
  const f = document.createElement('iframe');
  f.title = st.sp.title + ' 데모'; f.setAttribute('loading','eager'); f.setAttribute('scrolling','no');
  f.style.height = '100%';
  f.srcdoc = buildDoc(st);
  fr.appendChild(f); st.frame = f; st.loaded = true;
  f.addEventListener('load', ()=>{ const ph=fr.querySelector('.ph'); if(ph) ph.hidden=true; postHost(st); setTimeout(()=>postHost(st),120); });
}
function unload(st){
  if (!st.frame) return;
  st.frame.remove(); st.frame=null; st.loaded=false;
  const ph = st.el.querySelector('.ph'); if (ph) ph.hidden=false;
}
/* host scroll: tell each live demo where its pane is in the page viewport */
let lastY = scrollY, dir = 0;
function hostOf(st){
  const r = st.frame.getBoundingClientRect(), vh = innerHeight;
  const p = Math.min(1, Math.max(0, (vh - r.top) / (vh + r.height)));
  return { top: r.top, bottom: r.bottom, h: r.height, vh, p, dir };
}
function postHost(st){ if (st.frame && st.frame.contentWindow) st.frame.contentWindow.postMessage({type:'host', H: hostOf(st)}, '*'); }
let hostRaf = 0;
function pumpHost(){
  hostRaf = 0;
  const y = scrollY; if (y !== lastY) { dir = y > lastY ? 1 : -1; lastY = y; }
  SPECS.forEach(sp => { const st = S[sp.n]; if (st.frame) postHost(st); });
}
addEventListener('scroll', () => { if (!hostRaf) hostRaf = requestAnimationFrame(pumpHost); }, { passive: true });
addEventListener('resize', () => { if (!hostRaf) hostRaf = requestAnimationFrame(pumpHost); });
const nearIO = new IntersectionObserver(es => es.forEach(e => {
  const st = S[+e.target.dataset.n];
  if (e.isIntersecting){ if(!st.loaded) load(st); }
}), { rootMargin: '400px 0px' });
const farIO = new IntersectionObserver(es => es.forEach(e => {
  const st = S[+e.target.dataset.n];
  if (!e.isIntersecting) unload(st);
}), { rootMargin: '1600px 0px' });
SPECS.forEach(sp => { nearIO.observe(S[sp.n].el); farIO.observe(S[sp.n].el); });

/* ---------- value changes ---------- */
const reloadT = {};
function setVal(st, k, v, from){
  const p = st.sp.params.find(x=>x.key===k);
  if (p.type!=='select' && p.type!=='color' && p.type!=='toggle'){ v = Math.min(p.max, Math.max(p.min, +v)); v = +(+v).toFixed(decimals(p.step||1)); }
  st.vals[k] = v;
  // chips
  st.el.querySelectorAll(`.v[data-k="${k}"]`).forEach(c => {
    c.innerHTML = (p.type==='color'?`<span class="sw" style="background:${esc(v)}"></span>`:'') + esc(fmt(p,v));
    c.classList.toggle('changed', v!==st.def[k]);
  });
  // controls
  const ctl = st.el.querySelector(`.ctl[data-k="${k}"]`);
  if (p.type==='toggle'){ ctl.querySelector('.tg').setAttribute('aria-pressed', !!v); }
  else if (p.type==='color'){ ctl.querySelector('input').value=v; ctl.querySelector('.hex').textContent=v; }
  else if (p.type==='select'){ ctl.querySelector('select').value=v; }
  else { if(from!=='range') ctl.querySelector('input[type=range]').value=v; if(from!=='num') ctl.querySelector('.num').value=fmt(p,v); }
  // demo
  if (p.live === false){ clearTimeout(reloadT[st.sp.n]); reloadT[st.sp.n]=setTimeout(()=>{ if(st.loaded) load(st); }, 350); }
  else if (st.frame && st.frame.contentWindow) st.frame.contentWindow.postMessage({type:'P', P:{[k]:v}}, '*');
  markDirty(st, true);
}
function markDirty(st, d){ st.dirty=d; st.el.querySelector('[data-act="apply"]').disabled=!d; }
function markMod(st){
  const mod = Object.keys(st.def).some(k=>st.vals[k]!==st.def[k]) || SLOTS.some(s=>st.text[s]!==st.sp.slots[s]);
  const a = jump.querySelector(`a[data-n="${st.sp.n}"]`); if(a) a.classList.toggle('mod', mod);
}
function persist(){
  const out = {};
  SPECS.forEach(sp=>{ const st=S[sp.n]; const v={}, t={};
    for(const k in st.def) if(st.vals[k]!==st.def[k]) v[k]=st.vals[k];
    SLOTS.forEach(s=>{ if(st.text[s]!==sp.slots[s]) t[s]=st.text[s]; });
    if (Object.keys(v).length||Object.keys(t).length) out[sp.n]={v,t};
  });
  store.set(SAVE_KEY, out);
}
function readText(st){ // DOM -> template
  st.el.querySelectorAll('.txt').forEach(el=>{
    let s=''; el.childNodes.forEach(function walk(nd){
      if (nd.nodeType===3) s+=nd.nodeValue;
      else if (nd.classList && nd.classList.contains('v')) s+='{'+nd.dataset.k+'}';
      else if (nd.nodeName==='BR') s+=' ';
      else nd.childNodes.forEach(walk);
    });
    st.text[el.dataset.slot]=s.replace(/\s+/g,' ').trim();
  });
}
function renderText(st){ st.el.querySelectorAll('.txt').forEach(el=> el.innerHTML = slotHTML(st, el.dataset.slot)); }
function specText(st){
  const byKey={}; st.sp.params.forEach(p=>byKey[p.key]=p);
  const line = s => st.text[s].replace(/\{(\w+)\}/g,(m,k)=> byKey[k]? fmt(byKey[k], st.vals[k]) : m);
  return `#${nn(st.sp.n)} ${st.sp.title}${st.sp.en?` (${st.sp.en})`:''}\n` + SLOTS.map(s=>`[${s}] ${line(s)}`).join('\n');
}
function allText(){ return SPECS.map(sp=>specText(S[sp.n])).join('\n\n'); }

main.addEventListener('input', e => {
  const ctl = e.target.closest('.ctl'); if(!ctl) return;
  const st = S[+e.target.closest('.item').dataset.n], k = ctl.dataset.k;
  if (e.target.type==='range') setVal(st,k,e.target.value,'range');
  else if (e.target.classList.contains('num')) { if(e.target.value!=='') setVal(st,k,e.target.value,'num'); }
  else if (e.target.type==='color') setVal(st,k,e.target.value);
  else if (e.target.tagName==='SELECT') setVal(st,k,e.target.value);
  else if (e.target.closest('.txt')) markDirty(st,true);
});
main.addEventListener('input', e => { const t=e.target.closest('.txt'); if(t){ markDirty(S[+t.closest('.item').dataset.n], true); } });
main.addEventListener('focusin', e => { const c=e.target.closest('.ctl'); if(c){ const it=c.closest('.item'); it.querySelectorAll(`.v[data-k="${c.dataset.k}"]`).forEach(v=>{v.classList.remove('flash');void v.offsetWidth;v.classList.add('flash');}); } });
main.addEventListener('click', e => {
  const item = e.target.closest('.item'); if(!item) return;
  const st = S[+item.dataset.n];
  const chip = e.target.closest('.v');
  if (chip && !item.classList.contains('editing')){
    const c = item.querySelector(`.ctl[data-k="${chip.dataset.k}"]`);
    c.classList.add('hot'); setTimeout(()=>c.classList.remove('hot'),900);
    const inp = c.querySelector('input,select,button'); inp && inp.focus({preventScroll:true});
    c.scrollIntoView({block:'nearest',behavior:'smooth'}); return;
  }
  const tg = e.target.closest('.tg'); if (tg){ const k=tg.closest('.ctl').dataset.k; setVal(st,k,!st.vals[k]); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if (act==='apply'){
    if (item.classList.contains('editing')) readText(st);
    persist(); markMod(st); markDirty(st,false); load(st);
    const msg=item.querySelector('.msg'); msg.classList.add('on'); setTimeout(()=>msg.classList.remove('on'),1400);
  } else if (act==='reset'){
    st.vals = Object.assign({}, st.def); st.text = Object.assign({}, st.sp.slots);
    st.sp.params.forEach(p=>setVal(st,p.key,st.def[p.key]));
    renderText(st); persist(); markMod(st); markDirty(st,false); if(st.loaded) load(st); toast('기본값으로 되돌렸어요');
  } else if (act==='replay'){ load(st); }
  else if (act==='copy'){ if(item.classList.contains('editing')) readText(st); copy(specText(st), `#${nn(st.sp.n)} 명세서를 복사했어요`); }
  else if (act==='copyall'){ if(item.classList.contains('editing')) readText(st); copy(allText(), '97개 명세서를 모두 복사했어요'); }
  else if (act==='edit'){
    const on = !item.classList.contains('editing');
    if (!on){ readText(st); renderText(st); persist(); markMod(st); }
    item.classList.toggle('editing', on); b.setAttribute('aria-pressed', on); b.textContent = on ? '편집 마치기' : '텍스트 편집';
    item.querySelectorAll('.txt').forEach(t=> t.contentEditable = on ? 'true' : 'false');
    if (on) item.querySelector('.txt').focus();
  }
});
document.getElementById('allcopy').addEventListener('click', ()=> copy(allText(), '97개 명세서를 모두 복사했어요'));

/* filter tabs */
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed', x===b));
  const req = b.dataset.f==='req';
  SPECS.forEach(sp=>{ S[sp.n].el.hidden = req && sp.n>46; const a=jump.querySelector(`a[data-n="${sp.n}"]`); a.hidden = req && sp.n>46; });
  document.querySelectorAll('.sec').forEach(sec=>{ sec.hidden = [...sec.querySelectorAll('.item')].every(i=>i.hidden); });
  document.querySelectorAll('.part-h').forEach(h=> h.hidden = req && h.dataset.part==='2');
}));
})();
</script>
