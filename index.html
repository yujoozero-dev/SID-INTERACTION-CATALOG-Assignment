<style>
/* Layout: spec sheet left (text bound to dials), live specimen right; sticky index bar on top. */
:root{
  /* single dark identity: black ground, white type, key yellow #F6C945 */
  --bg:#0b0b0c; --paper:#141415; --ink:#f5f5f2; --muted:#9b9b96; --line:#2a2a2b; --soft:#1c1c1e;
  --accent:#f6c945; --accent-ink:#111111; --chip:rgba(246,201,69,.14); --chip-ink:#f6c945; --chip-on:#f6c945; --chip-on-ink:#111111;
  --stage:#121213; --ok:#f6c945;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* intro */
.intro{padding-block:40px 18px;display:grid;gap:14px}
.eyebrow{font-size:13px;letter-spacing:.02em;color:var(--muted);font-weight:500}
h1{margin:0;font-size:clamp(26px,3.4vw,38px);line-height:1.2;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.lead{margin:0;color:var(--muted);max-width:68ch}
.lead b{color:var(--ink);font-weight:600}
.howto{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
.howto li{display:flex;gap:6px;align-items:center}
.howto .k{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--chip-ink)}

/* index bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--soft)}
.tabs button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.jump{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.jump a{flex:none;font-family:var(--f-mono);font-size:11.5px;text-decoration:none;color:var(--muted);padding:4px 7px;border-radius:7px;border:1px solid var(--line);background:var(--paper)}
.jump a.req{color:var(--ink)}
.jump a.mod{border-color:var(--accent);color:var(--accent)}
.jump a:hover{border-color:var(--ink);color:var(--ink)}
.allcopy{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;flex:none}
.allcopy:hover{border-color:var(--ink)}
@media (max-width:600px){.jump{order:3;flex-basis:100%}.tabs{flex:1}}

/* parts */
.part-h{display:flex;align-items:baseline;gap:12px;margin:44px 0 14px}
.part-h h2{margin:0;font-size:20px}
.part-h span{color:var(--muted);font-size:13px}
.sec-h{font-size:13px;font-weight:600;color:var(--muted);margin:28px 0 10px;font-family:var(--f-mono);letter-spacing:.02em}
.list{display:grid;gap:18px}

/* item */
.item{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;scroll-margin-top:80px;display:grid;gap:16px}
.ihead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ihead .no{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ihead h3{margin:0;font-size:19px;font-weight:700;line-height:1.3}
.ihead h3 em{font-style:normal;font-weight:500;color:var(--muted);font-size:15px}
.ihead .tag{font-size:11px;font-family:var(--f-mono);padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.ihead .tag.adv{background:var(--chip);color:var(--chip-ink)}
.ibody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:stretch}
@media (max-width:900px){.ibody{grid-template-columns:minmax(0,1fr)}.live{order:-1}}

.spec{display:grid;gap:12px;min-width:0}
.spec-t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.spec-t svg{color:var(--accent)}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:12px;background:var(--soft)}
.row .lab{font-size:12.5px;color:var(--muted);font-weight:600;padding-top:1px}
.row .txt{font-size:14px;line-height:1.65;min-width:0}
.item.editing .row .txt{outline:1.5px dashed var(--accent);outline-offset:3px;border-radius:4px;background:var(--paper)}
.v{font-family:var(--f-mono);font-size:12.5px;font-weight:500;padding:1px 4px;border-radius:6px;background:var(--chip);color:var(--chip-ink);cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;overflow-wrap:anywhere;transition:background .15s,color .15s}
.v.changed{background:var(--chip-on);color:var(--chip-on-ink)}
.v.flash{animation:fl .6s}
@keyframes fl{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 6px transparent}}
.v .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:0;border:1px solid rgba(0,0,0,.15)}

.ctrls{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.ctl-grid{display:grid;gap:10px}
.below{display:grid;gap:12px}
.item.wide .ctl-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}
.item.wide .spec{align-content:start}
@media (max-width:900px){.item.wide .ctl-grid{grid-template-columns:minmax(0,1fr)}}
.ctrls-t{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.ctrls-t .live-n{font-family:var(--f-mono);font-weight:400}
.ctl{display:grid;grid-template-columns:minmax(90px,130px) minmax(0,1fr) 78px;gap:10px;align-items:center}
.ctl label{font-size:13px;line-height:1.3}
.ctl label small{display:block;color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl .num{width:100%;font-family:var(--f-mono);font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);text-align:right}
.ctl select{grid-column:2/4;width:100%;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:13px}
.ctl .colorbox{grid-column:2/4;display:flex;gap:8px;align-items:center}
.ctl input[type=color]{width:38px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.ctl .hex{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.ctl .tg{grid-column:2/4;justify-self:start;width:44px;height:26px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer}
.ctl .tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.ctl .tg[aria-pressed="true"]{background:var(--accent)}
.ctl .tg[aria-pressed="true"]::after{transform:translateX(18px)}
.ctl.hot label{color:var(--accent)}
@media (max-width:480px){.ctl{grid-template-columns:minmax(0,1fr) 70px}.ctl label{grid-column:1/3}.ctl select,.ctl .colorbox,.ctl .tg{grid-column:1/3}}

.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--paper)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:disabled{opacity:.38;cursor:default}
.btn:not(.pri):hover{border-color:var(--ink)}
.acts .msg{font-size:12.5px;color:var(--ok);opacity:0;transition:opacity .3s}
.acts .msg.on{opacity:1}

.live{min-width:0;display:flex;flex-direction:column;gap:8px}
.ltools{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.ltools button{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:5px 9px;border-radius:8px;cursor:pointer}
.ltools button:hover{background:var(--soft);color:var(--ink)}
.ltools button[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink)}
.frame{position:relative;flex:1 1 auto;min-height:var(--h,400px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--stage)}
.frame iframe{position:absolute;inset:0;height:100%!important}
@media (max-width:900px){.frame{flex:none;height:var(--h,400px)}}
.frame iframe{display:block;width:100%;border:0;background:transparent}
.frame .ph{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;color:var(--muted);font-size:13px}
.lfoot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.lfoot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.lfoot button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0}
.lfoot button:hover{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{padding-block:40px 60px;color:var(--muted);font-size:12.5px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

ementById(\"a1\");\na1.addEventListener(\"mouseenter\", () => gsap.to(\"#arrow\", { x: P.dist, duration: P.inDur, ease: P.ease }));\na1.addEventListener(\"mouseleave\", () => gsap.to(\"#arrow\", { x: 0, duration: P.outDur, ease: P.ease }));\n\u003c/script>\n\u003c/body>\u003c/html>\n", "02": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"gsap\">\n\u003cstyle>\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{background:var(--t-bg);color:var(--t-ink);font-family:\"Pretendard\",\"Apple SD Gothic Neo\",\"Noto Sans KR\",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:0 20px;overflow:hidden}\n.stage{width:100%;display:flex;align-items:center;justify-content:center;min-height:130px}\n.btn{padding:12px 22px;border:none;border-radius:999px;background:var(--t-accent);color:var(--t-accent-ink);font:inherit;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\" id=\"a2zone\">\u003cbutton class=\"btn\" id=\"a2\">이끌리는 버튼\u003c/button>\u003c/div>\n\u003cscript>\nconst P = PARAMS({ zoneH: 130, pull: 0.25, followDur: 0.4, returnDur: 0.6, returnEase: \"elastic.out(1, 0.5)\" });\nconst a2z = document.getElementById(\"a2zone\"), a2 = document.getElementById(\"a2\");\nfunction zone(){ a2z.style.minHeight = P.zoneH + \"px\"; }\nzone();\na2z.addEventListener(\"mousemove\", function (e) {\n  const r = a2z.getBoundingClientRect();\n  gsap.to(a2, { x: (e.clientX - r.left - r.width / 2) * P.pull, y: (e.clientY - r.top - r.height / 2) * P.pull, duration: P.followDur });\n});\na2z.addEventListener(\"mouseleave\", function () { gsap.to(a2, { x: 0, y: 0, duration: P.returnDur, ease: P.returnEase }); });\nonParams(zone);\n\u003c/script>\n\u003c/body>\u003c/html>\n", "03": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"gsap\">\n\u003cstyle>\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{background:var(--t-bg);color:var(--t-ink);font-family:\"Pretendard\",\"Apple SD Gothic Neo\",\"Noto Sans KR\",system-ui,sans-serif;display:grid;place-items:center;padding:0 20px;overflow:hidden;word-break:keep-all;line-height:1.6}\n#a3{font-size:1.5rem;font-weight:700;cursor:default;text-align:center;margin:0}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cp id=\"a3\">흐릿하던 문장이 선명해진다\u003c/p>\n\u003cscript>\nconst P = PARAMS({ blur: 6, size: 24, inDur: 0.3, outDur: 0.4 });\nconst a3 = document.getElementById(\"a3\");\nlet over = false;\na3.style.fontSize = P.size + \"px\";\na3.style.filter = \"blur(\" + P.blur + \"px)\";\na3.addEventListener(\"mouseenter\", function () { over = true; gsap.to(a3, { filter: \"blur(0px)\", duration: P.inDur }); });\na3.addEventListener(\"mouseleave\", function () { over = false; gsap.to(a3, { filter: \"blur(\" + P.blur + \"px)\", duration: P.outDur }); });\nonParams(function (c) {\n  a3.style.fontSize = P.size + \"px\";\n  if (!over && \"blur\" in c) { gsap.killTweensOf(a3); gsap.set(a3, { filter: \"blur(\" + P.blur + \"px)\" }); }\n});\n\u003c/script>\n\u003c/body>\u003c/html>\n", "04": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"gsap\">\n\u003cstyle>\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{background:var(--t-bg);color:var(--t-ink);font-family:\"Pretendard\",\"Apple SD Gothic Neo\",\"Noto Sans KR\",system-ui,sans-serif;display:grid;place-items:center;padding:0 20px;overflow:hidden;line-height:1.6}\n.stage{display:flex;align-items:center;justify-content:center;gap:14px;min-height:96px;flex-wrap:wrap}\n.thumb{width  const R=base*st.w;\n    pts.forEach((p,i)=>{const u=cum?p.d/cum:0;p.r=R*prof(st.p,u)*(1+0.05*Math.sin(i*0.21));});\n    return{pts,len:cum,R,drawn:-1};\n  });\n}\nlet strokes=[],t0=0,running=false,ci=-1;\n/* 시간 값은 P에서 매 프레임 읽음 (TOTAL=P.total, GROW=P.grow, FADE=P.fade) */\nfunction inkRGB(){const n=parseInt(P.ink.slice(1),16);return (n>>16&255)+','+(n>>8&255)+','+(n&255);}\nfunction inkRGBA(){return 'rgba('+inkRGB()+',0.95)';}\nfunction resize(){\n  dpr=Math.min(2,window.devicePixelRatio||1);\n  W=window.innerWidth;H=window.innerHeight;\n  [bc,ic].forEach(c=>{c.width=W*dpr;c.height=H*dpr;});\n  bx.setTransform(dpr,0,0,dpr,0,0);ix.setTransform(dpr,0,0,dpr,0,0);\n  S=Math.min(W,H)*P.area/100;X0=(W-S)/2;Y0=(H-S)/2;\n  if(ci>=0){strokes=build(CHARS[ci]);schedule();strokes.forEach(s=>s.drawn=-1);ix.clearRect(0,0,W,H);t0=performance.now()-P.total*1000;if(!running){running=true;requestAnimationFrame(frame);}}\n}\nfunction schedule(){\n  const sum=strokes.reduce((a,s)=>a+s.len,0)||1;\n  let acc=0;\n  strokes.forEach(s=>{s.start=acc;s.dur=P.total*1000*s.len/sum;acc+=s.dur;});\n}\nfunction stamp(p){\n  ix.fillStyle=inkRGBA();\n  ix.beginPath();ix.arc(p.x,p.y,p.r,0,Math.PI*2);ix.fill();\n}\nfunction haloPath(s){\n  const pth=new Path2D();\n  const pts=s.pts;\n  pth.moveTo(pts[0].x,pts[0].y);\n  for(let i=3;i\u003c=s.drawn;i+=3)pth.lineTo(pts[i].x,pts[i].y);\n  if(s.drawn>0)pth.lineTo(pts[s.drawn].x,pts[s.drawn].y);\n  else pth.lineTo(pts[0].x+0.1,pts[0].y);\n  return pth;\n}\nfunction halo(pth,width,blur,alpha){\n  const OFF=W+400;\n  bx.save();\n  bx.translate(-OFF,0);\n  bx.shadowOffsetX=OFF*dpr;\n  bx.shadowOffsetY=0;\n  bx.shadowBlur=blur*dpr;\n  bx.shadowColor='rgba('+inkRGB()+','+alpha.toFixed(3)+')'; /* 번짐도 먹색 계열 */\n  bx.strokeStyle='#000';\n  bx.lineCap='round';bx.lineJoin='round';\n  bx.lineWidth=width;\n  bx.stroke(pth);\n  bx.restore();\n}\nfunction frame(now){\n  const t=now-t0;\n  bx.clearRect(0,0,W,H);\n  let alive=false;\n  strokes.forEach(s=>{\n    const loc=Math.min(1,Math.max(0,(t-s.start)/s.dur));\n    if(t\u003cs.start){alive=true;return;}\n    const target=Math.floor(loc*(s.pts.length-1));\n    for(let i=s.drawn+1;i\u003c=target;i++)stamp(s.pts[i]);\n    if(target>s.drawn)s.drawn=target;\n    const el=t-s.start;\n    const GROW=P.grow*1000,FADE=P.fade*1000;\n    const g=GROW>0?Math.min(1,el/GROW):1;\n    const e=1-Math.pow(1-g,3);\n    const sp=P.spread*e;\n    let a=P.haloAlpha;\n    if(el>GROW)a=P.haloAlpha*Math.max(0,FADE>0?1-(el-GROW)/FADE:0);\n    if(a>0.002){\n      alive=true;\n      const pth=haloPath(s);\n      halo(pth,2*s.R+sp*0.7,sp*0.65,a);\n      halo(pth,2*s.R+sp*0.2,sp*0.25+2,a*0.9);\n    }\n    if(loc\u003c1)alive=true;\n  });\n  if(alive)requestAnimationFrame(frame);else running=false;\n}\nfunction play(){\n  h.style.opacity=0;\n  ci=(ci+1)%CHARS.length;\n  ix.clearRect(0,0,W,H);\n  strokes=build(CHARS[ci]);\n  schedule();\n  t0=performance.now();\n  if(!running){running=true;requestAnimationFrame(frame);}\n}\nwindow.addEventListener('resize',resize);\ndocument.addEventListener('pointerdown',play);\nresize();\n/* 굵기·영역·먹색이 바뀌면 지금 글자를 새 값으로 즉시 다시 그림, 시간 값은 다음 글자부터 */\nonParams(c=>{if('thick' in c||'area' in c||'ink' in c)resize();else if('total' in c&&strokes.length)schedule();});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "59": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>Hover Glitch\u003c/title>\n\u003cstyle>\n  :root {\n    --bg: var(--t-bg);\n    --fg: var(--t-ink);\n    --sub: var(--t-muted);\n    --red: #ff6f86;\n    --blue: #5aa9ff;\n  }\n  * { box-sizing: border-box; }\n  html, body { height: 100%; margin: 0; }\n  body {\n    background: var(--bg);\n    color: var(--fg);\n    font-family: -apple-system, \"Apple SD Gothic Neo\", \"Pretendard\", \"Noto Sans KR\", sans-serif;\n    display: flex;\n    flex-directio --red', P.red);\n    root.style.setProperty('--blue', P.blue);\n    hd.textContent = String(P.dur);\n  }\n  build(); style();\n\n  const rand = () => Math.round((Math.random() * 2 - 1) * P.maxShift);\n\n  function shuffle() {\n    slices.forEach(s => {\n      const dx = rand();\n      const ghost = P.ghostMin + Math.random() * Math.max(0, P.ghostMax - P.ghostMin);\n      s.style.transform = `translateX(${dx}px)`;\n      s.style.textShadow = `${-ghost}px 0 var(--red), ${ghost}px 0 var(--blue)`;\n    });\n  }\n\n  let timer = null, end = null;\n\n  function reset() {\n    clearInterval(timer); clearTimeout(end);\n    timer = end = null;\n    el.classList.remove('on');\n    slices.forEach(s => { s.style.transform = ''; s.style.textShadow = ''; });\n  }\n\n  el.addEventListener('mouseenter', () => {\n    reset();\n    el.classList.add('on');\n    shuffle();\n    timer = setInterval(shuffle, P.step * 1000);\n    end = setTimeout(reset, P.dur * 1000);\n  });\n\n  onParams(c => { if ('slices' in c) { reset(); build(); } style(); });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "60": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>알약 모핑\u003c/title>\n\u003cstyle>\n  :root { --bg:var(--t-bg); --ink:var(--t-ink); --sub:var(--t-muted); --dur:.5s; --ease:cubic-bezier(.4,0,.2,1); --fo:.2s; --fi:.2s; --fd:.3s; --pill:#f6c945; --vol:62%; }\n  * { box-sizing:border-box; margin:0; }\n  html,body { height:100%; }\n  body {\n    background:var(--bg); color:var(--ink);\n    font-family:-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Pretendard\",sans-serif;\n    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;\n    word-break:keep-all; overflow-wrap:break-word; padding:16px;\n  }\n  .stage { height:200px; display:flex; align-items:center; justify-conte /section>\n\u003csection data-shape=\"0\">\u003cp class=\"label\">\u003cb>01\u003c/b>손\u003c/p>\u003c/section>\n\u003csection data-shape=\"1\">\u003cp class=\"label\">\u003cb>02\u003c/b>별\u003c/p>\u003c/section>\n\u003csection data-shape=\"2\">\u003cp class=\"label\">\u003cb>03\u003c/b>로고\u003c/p>\u003c/section>\n\u003csection data-shape=\"-1\">\u003cp class=\"label\">\u003cb>04\u003c/b>흩어짐\u003c/p>\u003c/section>\n\u003c/div>\n\n\u003cscript>\nconst P = PARAMS({ count: 1200, dur: 1.2, delay: 25, scale: 62, repelR: 80, repelF: 2.2, spring: 0.06, color: \"#f6c945\" });\n(() => {\n  const N = Math.round(P.count);\n  // 시간·반발·스프링 값은 매 프레임 P에서 읽음\n\n  let BG = T('bg'); onTheme(() => { BG = T('bg'); });\n  const cv = document.getElementById('c');\n  const ctx = cv.getContext('2d');\n  let W = 0, H = 0, DPR = 1;\n\n  // 점 상태\n  const PT = Array.from({ length: N }, () => ({\n    sx: 0, sy: 0,\n    fx: 0, fy: 0,\n    bx: 0, by: 0,\n    ox: 0, oy: 0,\n    vx: 0, vy: 0,\n    r: 1 + Math.random() * 1.2,\n    dr: Math.random() // 개별 지연 비율 = dr × P.delay%\n  }));\n\n  let shapes = [];\n  let current = -1;\n  let tStart = -1e9;\n\n  const mouse = { x: -9999, y: -9999 };\n\n  // ---------- 모양 그리기 ----------\n  function drawHand(g, s) {\n    g.save();\n    g.translate(s / 2, s / 2);\n    const u = s / 100;\n    const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x * u, y * u, w * u, h * u, r * u); g.fill(); };\n    // 손바닥\n    rr(-22, -6, 44, 40, 12);\n    // 손가락 4개\n    rr(-22, -36, 10, 40, 5);\n    rr(-10, -42, 10, 46, 5);\n    rr(2, -40, 10, 44, 5);\n    rr(14, -32, 9, 36, 4.5);\n    // 엄지\n    g.save();\n    g.translate(-20 * u, 10 * u);\n    g.rotate(-0.75);\n    g.beginPath(); g.roundRect(-28 * u, -5 * u, 30 * u, 10 * u, 5 * u); g.fill();\n    g.restore();\n    // 손목\n    rr(-16, 30, 32, 14, 4);\n    g.restore();\n  }\n  function drawStar(g, s) {\n    const cx = s / 2, cy = s / 2 + s * 0.03, R = s * 0.46, r = R * 0.42;\n    g.beginPath();\n    for (let i = 0; i \u003c 10; i++) {\n      const a = -Math.PI / 2 + i * Math.PI / 5;\n      const rad = i % 2 ? r : R;\n      g.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);\n    }\n    g.closePath(); g.fill();\n  }\n  function drawLogo(g, s) {\n    const cx = s / 2, cy = s / 2;\n    g.lineWidth = s * 0.06;\n    g.strokeStyle = '#fff';\n    g.beginPath(); g.arc(cx, cy, s * 0.44, 0, Math.PI * 2); g.stroke();\n    g.font = `800 ${Math.round(s * 0.42)}px -apple-system, \"Helvetica Neue\", Arial, sans-serif`;\n    g.textAlign = 'center'; g.textBaseline = 'middle';\n    g.fillText('SI', cx, cy + s * 0.02);\n  }\n\n  function sampleShape(drawFn) {\n    const size = Math.round(Math.min(W, H) * P.scale / 100);\n    const oc = document.createElement('canvas');\n    oc.width = oc.height = size;\n    const g = oc.getContext('2d');\n    g.fillStyle = '#fff';\n    drawFn(g, size);\n    const data = g.getImageData(0, 0, size, size).data;\n    const step = Math.max(2, Math.round(size / 160));\n    const pts = [];\n    for (let y = 0; y \u003c size; y += step)\n      for (let x = 0; x \u003c size; x += step)\n        if (data[(y * size + x) * 4 + 3] > 128) pts.push({ x, y });\n    // 섞어서 N개 선택 (부족하면 반복 + 미세 흔들림)\n    for (let i = pts.length - 1; i > 0; i--) {\n      const j = (Math.random() * (i + 1)) | 0; [pts[i], pts[j]] = [pts[j], pts[i]];\n    }\n    const ox = (W - size) / 2, oy = (H - size) / 2;\n    const out = [];\n    for (let i = 0; i \u003c N; i++) {\n      const p = pts[i % pts.length];\n      const jit = i >= pts.length ? step * 0.5 : 0;\n      out.push({ x: ox + p.x + (Math.random() - .5) * jit, y: oy + p.y + (Math.random() - .5) * jit });\n    }\n    return out;\n  }\n\n  function target(i, k) {\n    return k \u003c 0 ? { x: PT[i].sx, y: PT[i].sy } : shapes[k][i];\n  }\n\n  function resize() {\n    DPR = Math.min(window.devicePixelRatio || 1, 2);\n    W = innerWidth; H = innerHeight;\n    cv.width = W * DPR; cv.height = H * DPR;\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    for (const p of PT) { p.sx = Math.random() * W; p.sy = Math.random() * H; }\n    shapes = [sampleShape(drawHand), sampleShape(drawStar), sampleShape(drawLogo)];\n    // 크기 변경 시 현재 상태로 바로 정렬\n    PT.forEach((p, i) => { const t = target(i, current); p.bx = p.fx = t.x; p.by = p.fy = t.y; });\n    tStart = -1e9;\n  }\n\n  // ---------- 전환 ----------\n  function setShape(k) {\n    if (k === current) return;\n    for (const p of PT) { p.fx = p.bx; p.fy = p.by; }\n    current = k;\n    tStart = performance.now();\n  }\n  const ease = t => t \u003c .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;\n\n  // ---------- 스크롤 구간 (이 창 위에서 스크롤) ----------\n  // 창 윗변이 화면 높이 85% → -20% 지점까지 올라가는 거리를 5등분해 구간 0~4\n  const sections = [...document.querySelectorAll('section')];\n  let secIdx = 0;\n  function onScroll() {\n    const p = hostProgress(HOST(), 0.85, -0.2);\n    const idx = Math.min(sections.length - 1, Math.floor(p * sections.length));\n    if (idx !== secIdx) { sections[secIdx].classList.remove('cur'); sections[idx].classList.add('cur'); secIdx = idx; }\n    setShape(parseInt(sections[idx].dataset.shape, 10));\n  }\n\n  // ---------- 커서 ----------\n  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });\n  addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });\n  document.addEventListener('mouseleave', () => { mouse.x = mouse.y = -9999; });\n  addEventListener('touchend', () => { mouse.x = mouse.y = -9999; });\n\n  // ---------- 루프 ----------\n  function frame(now) {\n    const elapsed = now - tStart;\n    const DURATION = P.dur * 1000, REPEL_R = P.repelR, REPEL_FORCE = P.repelF, K = P.spring;\n    ctx.fillStyle = BG;\n    ctx.fillRect(0, 0, W, H);\n    ctx.fillStyle = P.color;\n\n    for (let i = 0; i \u003c N; i++) {\n      const p = PT[i];\n      // 개별 지연을 둔 1.2초 전환 (전체 소요 = DURATION)\n      const pd = p.dr * P.delay / 100;\n      const local = DURATION * (1 - pd) > 0 ? Math.min(1, Math.max(0, (elapsed - pd * DURATION) / (DURATION * (1 - pd)))) : 1;\n      const e = ease(local);\n      const t = target(i, current);\n      p.bx = p.fx + (t.x - p.fx) * e;\n      p.by = p.fy + (t.y - p.fy) * e;\n\n      // 커서 반발: 반경 80px 안이면 바깥으로 밀기\n      const px = p.bx + p.ox, py = p.by + p.oy;\n      const dx = px - mouse.x, dy = py - mouse.y;\n      const d2 = dx * dx + dy * dy;\n      if (d2 \u003c REPEL_R * REPEL_R && d2 > 0.01) {\n        const d = Math.sqrt(d2);\n        const f = (1 - d / REPEL_R) * REPEL_FORCE;\n        p.vx += (dx / d) * f;\n        p.vy += (dy / d) * f;\n      }\n      // 스프링 복귀 + 감쇠\n      p.vx += -p.ox * K; p.vy += -p.oy * K;\n      p.vx *= 0.82; p.vy *= 0.82;\n      p.ox += p.vx; p.oy += p.vy;\n\n      ctx.beginPath();\n      ctx.arc(p.bx + p.ox, p.by + p.oy, p.r, 0, Math.PI * 2);\n      ctx.fill();\n    }\n    requestAnimationFrame(frame);\n  }\n\n  addEventListener('resize', () => { resize(); onScroll(); });\n  onHost(onScroll);\n  resize();\n  onScroll();\n  requestAnimationFrame(frame);\n  // 모양 크기가 바뀌면 현재 모양으로 즉시 재정렬\n  onParams(c => { if ('scale' in c) resize(); });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "64": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>점 물결\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;overflow:hidden}\nbody{background:var(--t-bg);font-family:\"Apple SD Gothic Neo\",\"Noto Sans KR\",\"Malgun Gothic\",system-ui,sans-serif;cursor:pointer;user-select:none}\ncanvas{position:fixed;inset:0;width:100%;height:100%;display:block}\n.hint{position:fixed;left:0;right:0;bottom:18px;text-align:center;font-size:13px;color:var(--t-muted);transition:opacity .4s;pointer-events:none}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"c\">\u003c/canvas>\n\u003cdiv class=\"hint\" id=\"h\">눌러 보세요\u003c/div>\n\u003cscript>\nconst P = PARAMS({ gap: 22, dot: 2.2, speed: 400, rings: 3, ringDelay: 0.16, sig: 15, maxScale: 1.8 });\nconst c=document.getElementById('c'),x=c.getContext('2d'),h=document.getElementById('h');\nlet W,H,dpr,dots=[],ripples=[],running=false;\n/* 팔레트: 기본 점 = 배경색과 보조 글자색의 중간, 물결이 지나가면 강조색 */\nlet CB=[0,0,0],CA=[0,0,0];\nfunction rgbOf(s){s=s.trim();if(s[0]==='#'){if(s.length===4)s='#'+s[1]+s[1]+s[2]+s[2]+s[3]+s[3];return [1,3,5].map(k=>parseInt(s.substr(k,2),16));}const m=s.match(/\\d+/g)||[0,0,0];return m.slice(0,3).map(Number);}\nfunction readTheme(){const b=rgbOf(T('bg')),m=rgbOf(T('muted'));CB=b.map((v,i)=>v+(m[i]-v)*0.5);CA=rgbOf(T('accent'));}\nreadTheme();\nfunction resize(){\n  dpr=Math.min(2,window.devicePixelRatio||1);\n  W=window.innerWidth;H=window.innerHeight;\n  c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);\n  dots=[];\n  const GAP=P.gap;\n  const cols=Math.floor((W-GAP)/GAP),rows=Math.floor((H-GAP)/GAP);\n  const ox=(W-(cols-1)*GAP)/2,oy=(H-(rows-1)*GAP)/2;\n  for(let j=0;j\u003crows;j++)for(let i=0;i\u003ccols;i++)dots.push({x:ox+i*GAP,y:oy+j*GAP});\n  draw(performance.now());\n}\nfunction draw(now){\n  const SPEED=P.speed,RINGS=P.rings,RING_DELAY=P.ringDelay,SIG=P.sig,DOT=P.dot;\n  x.clearRect(0,0,W,H);\n  const maxD=Math.hypot(W,H)+80;\n  ripples=ripples.filter(r=>SPEED*((now-r.t)/1000-(RINGS-1)*RING_DELAY)\u003cmaxD);\n  ripples.forEach(r=>{\n    const el=(now-r.t)/1000;\n    for(let k=0;k\u003cRINGS;k++){\n      const f=SPEED*(el-k*RING_DELAY);\n      if(f\u003c=0)continue;\n      x.strokeStyle='rgba('+CA.join(',')+','+(0.07*Math.max(0,1-f/maxD)).toFixed(3)+')';\n      x.lineWidth=1;\n      x.beginPath();x.arc(r.x,r.y,f,0,Math.PI*2);x.stroke();\n    }\n  });\n  for(const d of dots){\n    let m=0;\n    for(const r of ripples){\n      const el=(now-r.t)/1000;\n      const dist=Math.hypot(d.x-r.x,d.y-r.y);\n      for(let k=0;k\u003cRINGS;k++){\n        const f=SPEED*(el-k*RING_DELAY);\n        if(f\u003c-SIG*3)continue;\n        const dd=dist-f;\n        const gv=Math.exp(-(dd*dd)/(2*SIG*SIG));\n        if(gv>m)m=gv;\n      }\n    }\n    const s=1+(P.maxScale-1)*m;\n    x.fillStyle='rgb('+CB.map((v,i)=>Math.round(v+(CA[i]-v)*m)).join(',')+')';\n    x.beginPath();x.arc(d.x,d.y,DOT*s,0,Math.PI*2);x.fill();\n  }\n}\nfunction loop(now){\n  draw(now);\n  if(ripples.length)requestAnimationFrame(loop);else{running=false;draw(now);}\n}\ndocument.addEventListener('pointerdown',e=>{\n  h.style.opacity=0;\n  ripples.push({x:e.clientX,y:e.clientY,t:performance.now()});\n  if(!running){running=true;requestAnimationFrame(loop);}\n});\nwindow.addEventListener('resize',resize);\nresize();\nonParams(()=>{resize();});\nonTheme(()=>{readTheme();draw(performance.now());});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "65": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>블록 물결\u003c/title>\n\u003cstyle>\nhtml,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--t-bg),var(--t-soft))}\ncanvas{display:block;width:100vw;height:100vh;cursor:pointer}\n.hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;font:500 13px -apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Noto Sans KR\",sans-serif;color:var(--t-muted);letter-spacing:.02em;pointer-events:none;transition:opacity .6s}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"c\">\u003c/canvas>\n\u003cdiv class=\"hint\" id=\"hint\">커서를 올려 보세요\u003c/div>\n\u003cscript>\nconst P = PARAMS({ n: 16, maxH: 60, waveSpeed: 6.5, waveAmp: 30, interval: 0.65, stiff: 170, damp: 16, color: \"#f6c945\" });\nconst cv=document.getElementById('c');\nconst ctx=cv.getContext('2d');\nconst hint=document.getElementById('hint');\nconst N=P.n;let MAX=P.maxH;\nlet W=0,H=0,tw=0,th=0,ox=0,oy=0,dep=0;\nconst h=new Float32Array(N*N),v=new Float32Array(N*N),tg=new Float32Array(N*N);\nlet cur=null,ripples=[],lastCell=-1,lastSpawn=0;\nlet C0=[228,232,240],C1=[246,201,69],SURF=\"255,255,255\";\nfunction hex(c){return [1,3,5].map(k=>parseInt(c.substr(k,2),16));}\nC1=hex(P.color);\n/* 기본 블록 색 = 옅은 면색(다크에선 선색), 윗면 테두리 = 표면색 (테마 따라 바뀜) */\nfunction readTheme(){C0=hex(T(THEME()==='dark'?'line':'soft'));SURF=hex(T('surface')).join(',');}\nreadTheme();onTheme(readTheme);\n\nfunction resize(){\n  const dpr=Math.min(window.devicePixelRatio||1,2);\n  W=window.innerWidth;H=window.innerHeight;\n  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);\n  ctx.setTransform(dpr,0,0,dpr,0,0);\n  tw=Math.max(8,Math.min((W-40)/N,(H-MAX-44)/(N/2+0.4)));\n  th=tw/2;dep=tw*0.4;\n  ox=W/2;\n  oy=(H-(N*th+dep+MAX))/2+MAX;\n}\nwindow.addEventListener('resize',resize);\nresize();\n\nfunction pick(mx,my){\n  const a=(mx-ox)/(tw/2),b=(my-oy)/(th/2);\n  const i=Math.floor((a+b)/2),j=Math.floor((b-a)/2);\n  if(i\u003c0||j\u003c0||i>=N||j>=N)return null;\n  return {i,j};\n}\nfunction spawn(i,j){\n  const now=performance.now();\n  ripples.push({i,j,t:now});\n  lastSpawn=now;\n}\ncv.addEventListener('pointermove',e=>{\n  cur=pick(e.clientX,e.clientY);\n  if(cur){\n    hint.style.opacity=0;\n    const id=cur.j*N+cur.i;\n    if(id!==lastCell){lastCell=id;spawn(cur.i,cur.j);}\n  }else lastCell=-1;\n});\ncv.addEventListener('pointerleave',()=>{cur=null;lastCell=-1;});\n\nfunction mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}\nfunction rgb(c,f){return 'rgb('+Math.round(c[0]*f)+','+Math.round(c[1]*f)+','+Math.round(c[2]*f)+')';}\n\nfunction drawBlock(i,j,lift){\n  const x=ox+(i-j)*tw/2;\n  const y=oy+(i+j)*th/2-lift;\n  const t=Math.max(0,Math.min(1,lift/MAX));\n  const c=mix(C0,C1,Math.pow(t,0.75));\n  const hw=tw/2,hq=th/2,fh=lift+dep;\n  ctx.beginPath();\n  ctx.moveTo(x-hw,y+hq);ctx.lineTo(x,y+th);ctx.lineTo(x,y+th+fh);ctx.lineTo(x-hw,y+hq+fh);ctx.closePath();\n  ctx.fillStyle=rgb(c,.82);ctx.fill();\n  ctx.beginPath();\n  ctx.moveTo(x+hw,y+hq);ctx.lineTo(x,y+th);ctx.lineTo(x,y+th+fh);ctx.lineTo(x+hw,y+hq+fh);ctx.closePath();\n  ctx.fillStyle=rgb(c,.68);ctx.fill();\n  ctx.beginPath();\n  ctx.moveTo(x,y);ctx.lineTo(x+hw,y+hq);ctx.lineTo(x,y+th);ctx.lineTo(x-hw,y+hq);ctx.closePath();\n  ctx.fillStyle=rgb(c,1);ctx.fill();\n  ctx.strokeStyle='rgba('+SURF+',.45)';ctx.lineWidth=1;ctx.stroke();\n}\n\nlet prev=performance.now();\nfunction frame(now){\n  const dt=Math.min(0.033,(now-prev)/1000);prev=now;\n  if(cur&&now-lastSpawn>P.interval*1000)spawn(cur.i,cur.j);\n  ripples=ripples.filter(r=>now-r.t\u003c2600);\n  for(let j=0;j\u003cN;j++){\n    for(let i=0;i\u003cN;i++){\n      let t=0;\n      if(cur){const dx=i-cur.i,dy=j-cur.j;t=MAX*Math.exp(-(dx*dx+dy*dy)/0.55);}\n      let s=0;\n      for(const r of ripples){\n        const age=(now-r.t)/1000;\n        const dx=i-r.i,dy=j-r.j;\n        const d=Math.sqrt(dx*dx+dy*dy);\n        if(d\u003c0.5)continue;\n        const q=d-age*P.waveSpeed;\n        s+=P.waveAmp*Math.exp(-age*1.7)*Math.exp(-q*q/1.1);\n      }\n      tg[j*N+i]=Math.min(MAX,Math.max(t,s));\n    }\n  }\n  for(let k=0;k\u003cN*N;k++){\n    const a=(tg[k]-h[k])*P.stiff-v[k]*P.damp;\n    v[k]+=a*dt;h[k]+=v[k]*dt;\n    if(h[k]>MAX){h[k]=MAX;if(v[k]>0)v[k]=0;}\n    if(h[k]\u003c-3){h[k]=-3;if(v[k]\u003c0)v[k]=0;}\n  }\n  ctx.clearRect(0,0,W,H);\n  ctx.beginPath();\n  const sy=oy+dep+8;\n  ctx.moveTo(ox,sy);ctx.lineTo(ox+N*tw/2,sy+N*th/2);ctx.lineTo(ox,sy+N*th);ctx.lineTo(ox-N*tw/2,sy+N*th/2);ctx.closePath();\n  ctx.fillStyle='rgba(30,45,80,.08)';ctx.fill();\n  for(let s=0;s\u003c=2*(N-1);s++){\n    for(let i=Math.max(0,s-N+1);i\u003c=Math.min(N-1,s);i++){\n      const j=s-i;\n      drawBlock(i,j,h[j*N+i]);\n    }\n  }\n  requestAnimationFrame(frame);\n}\nrequestAnimationFrame(frame);\nonParams(()=>{C1=hex(P.color);if(MAX!==P.maxH){MAX=P.maxH;resize();}});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "66": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta chars harray=L+' '+L;\ntrail.style.strokeDashoffset=L;\nfunction update(){\n  /* 이 창 위에서 스크롤: 창 윗변이 화면 startAt% → endAt% 로 올라가는 동안 p 0→1 */\n  const p=hostProgress(HOST(),P.startAt/100,P.endAt/100);\n  trail.style.strokeDashoffset=L*(1-p);\n  const pt=trail.getPointAtLength(L*p);\n  dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);\n  halo.setAttribute('cx',pt.x);halo.setAttribute('cy',pt.y);\n  flag.style.opacity=p>0.995?1:0;\n  hint.style.opacity=p>0.02?0:1;\n}\nonHost(update);\nwindow.addEventListener('resize',update);\nupdate();\nonParams(()=>{apply();update();});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "67": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>헤드폰 펜 드로잉\u003c/title>\n\u003cstyle>\n  :root { --ink:var(--t-ink); --blue:#f6c945; --bg:var(--t-bg); --muted:var(--t-muted); }\n  * { box-sizing:border-box; }\n  body { margin:0; background:var(--bg); color:var(--ink);\n         font-family:-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Pretendard\",sans-serif;\n         word-break:keep-all; overflow-wrap:break-word; }\n  html, body { height:100%; overflow:hidden; }\n  .stage { height:100%; display:flex; flex-direction:column; align-items:center;\n           justify-content:center; gap:16px; padding:0 16px; }\n  svg { width:min(80vw,360px); height:auto; overflow:visible; }\n  .shape { fill:var(--blue); fill-opacity:0; stroke:var(--ink); stroke-width:3;\n           stroke-linejoin:round; stroke-linecap:round; transition:fill-opacity .5s ease; }\n  .filled .shape { fill-opacity:1; }\n  #pen { transition:opacity .2s; }\n  .status { font-size:14px; color:var(--muted); min-height:1.4em; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003csection class=\"stage\">\n    \u003csvg id=\"art\" viewBox=\"0 30 200 170\" aria-label=\"헤드폰 그림\">\n      \u003c!-- 획 순서: 머리띠 → 왼쪽 이어컵 → 오른쪽 이어컵 -->\n      \u003cpath class=\"shape\" d=\"M30 110 A70 70 0 0 1 170 110 L158 110 A58 58 0 0 0 42 110 Z\"/>\n      \u003cpath class=\"shape\" d=\"M36 100 H42 A14 14 0 0 1 56 114 V148 A14 14 0 0 1 42 162 H36 A14 14 0 0 1 22 148 V114 A14 14 0 0 1 36 100 Z\"/>\n      \u003cpath class=\"shape\" d=\"M158 100 H164 A14 14 0 0 1 178 114 V148 A14 14 0 0 1 164 162 H158 A14 14 0 0 1 144 148 V114 A14 14 0 0 1 158 100 Z\"/>\n      \u003c!-- 펜: 펜촉이 (0,0)에 오도록 그림 -->\n      \u003cg id=\"pen\" opacity=\"0\">\n        \u003cg transform=\"rotate(-135)\">\n          \u003cpath d=\"M0 0 L5 -9 L-5 -9 Z\" fill=\"#f3d9a4\" stroke=\"#1f2937\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/>\n          \u003cpath d=\"M0 0 L1.6 -3 L-1.6 -3 Z\" fill=\"#1f2937\"/>\n          \u003crect x=\"-5\" y=\"-40\" width=\"10\" height=\"31\" rx=\"1.5\" fill=\"#f59e0b\" stroke=\"#1f2937\" stroke-width=\"1.2\"/>\n          \u003crect x=\"-5\" y=\"-46\" width=\"10\" height=\"6\" rx=\"2\" fill=\"#ef4444\" stroke=\"#1f2937\" stroke-width=\"1.2\"/>\n        \u003c/g>\n      \u003c/g>\n    \u003c/svg>\n    \u003cdiv class=\"status\" id=\"status\">\u003c/div>\n  \u003c/section>\n\n\u003cscript>\nconst P = PARAMS({ drawSec: 2, fillDur: 0.5, fillColor: \"#f6c945\", strokeW: 3, size: 360, threshold: 50 });\n(() => {\n  const svg = document.getElementById('art');\n  const pen = document.getElementById('pen');\n  const status = document.getElementById('status');\n  const paths = [...svg.querySelectorAll('.shape')];\n  const lens = paths.map(p => p.getTotalLength());\n  const total = lens.reduce((a, b) => a + b, 0);\n  let raf = null, done = false;\n\n  function reset() {\n    cancelAnimationFrame(raf);\n    done = false;\n    svg.classList.remove('filled');\n    pen.setAttribute('opacity', '0');\n    paths.forEach((p, i) => {\n      p.style.strokeDasharray = lens[i];\n      p.style.strokeDashoffset = lens[i];\n    });\n    status.textContent = '';\n  }\n\n  function play() {\n    reset();\n    pen.setAttribute('opacity', '1');\n    status.textContent = '그리는 중…';\n    const start = performance.now();\n    const tick = now => {\n      const t = Math.min((now - start) / (P.drawSec * 1000), 1);\n      let dist = t * total;\n      let tip = null;\n      paths.forEach((p, i) => {\n        const d = Math.max(0, Math.min(dist, lens[i]));\n        p.style.strokeDashoffset = lens[i] - d;\n        if (tip === null && dist \u003c= lens[i]) tip = p.getPointAtLength(d);\n        dist -= lens[i];\n      });\n      if (!tip) tip = paths[paths.length - 1].getPointAtLength(lens[lens.length - 1]);\n      pen.setAttribute('transform', `translate(${tip.x} ${tip.y})`);\n      if (t \u003c 1) { raf = requestAnimationFrame(tick); return; }\n      done = true;\n      pen.setAttribute('opacity', '0');\n      svg.classList.add('filled');\n      status.textContent = '완료';\n    };\n    raf = requestAnimationFrame(tick);\n  }\n\n  function style() {\n    const r = document.documentElement.style;\n    r.setProperty('--blue', P.fillColor);\n    paths.forEach(p => { p.style.strokeWidth = P.strokeW; p.style.transition = 'fill-opacity ' + P.fillDur + 's ease'; });\n    svg.style.width = 'min(80vw,' + P.size + 'px)';\n  }\n  style();\n  reset();\n  // 이 창 위에서 스크롤: 그림이 페이지 화면에 threshold% 이상 보이면 재생, 그 아래로 내려가면 초기화\n  function visFrac(el, H) {\n    const r = el.getBoundingClientRect();\n    if (!r.height) return 0;\n    const lo = Math.max(H.top + r.top, 0, H.top), hi = Math.min(H.top + r.bottom, H.vh, H.bottom);\n    return Math.max(0, hi - lo) / r.height;\n  }\n  let inView = false;\n  function check(H) {\n    if (!H) return;\n    const v = visFrac(svg, H) >= P.threshold / 100 - 1e-6;\n    if (v && !inView) play();\n    else if (!v && inView) reset();\n    inView = v;\n  }\n  onHost(check);\n  onParams(() => { style(); check(HOST()); });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "68": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\" ipt>\n\u003c/body>\n\u003c/html>\n", "74": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>Text Hover Glow\u003c/title>\n\u003cstyle>\n  :root {\n    --page: var(--t-bg);\n    --panel: #8a6a14;        /* 기본 둘레 배경 */\n    --text: #f2f4f7;\n    --glow: rgba(245, 181, 67, 0.85);\n    --glow2: rgba(245, 181, 67, 0.35);\n    --glow0: rgba(245, 181, 67, 0);\n    --bright: 1.2;\n    --fs: 44px;\n    --dur: 0.4s;             /* 번짐 시간 */\n    --radius: 120px;         /* 번짐 반지름 */\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; height: 100%; }\n  body {\n    background: var(--page);\n    color: var(--text);\n    font-family: -apple-system, BlinkMacSystemFont, \"Apple SD Gothic Neo\", \"Pretendard\", sans-serif;\n    word-break: keep-all;\n    overflow-wrap: break-word;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    gap: 24px;\n    padding: 24px 16px;\n  }\n  .hint { color: var(--t-ink); font-size: 14px; opacity: 0.6; margin: 0; }\n\n  .row {\n    display: flex;\n    flex-wrap: nowrap;\n    gap: 16px;\n    justify-content: center;\n  }\n\n  /* 둘레 배경 영역 */\n  .zone {\n    position: relative;\n    width: 300px;\n    max-width: 100%;\n    height: 300px;\n    border-radius: 20px;\n    overflow: hidden;\n    display: grid;\n    place-items: center;\n    isolation: isolate;\n  }\n  /* 배경 레이어: 호버 시 20% 밝아짐 */\n  .zone::before {\n    content: \"\";\n    position: absolute;\n    inset: 0;\n    background: var(--panel);\n    filter: brightness(1);\n    transition: filter var(--dur) ease-out;\n    z-index: -2;\n  }\n  .zone:has(.word:hover)::before { filter: brightness(var(--bright)); }\n\n  /* 글자 */\n  .word {\n    position: relative;\n    font-size: var(--fs);\n    font-weight: 700;\n    letter-spacing: -0.02em;\n    cursor: default;\n ight - 90) / needH);\n    row.style.zoom = z;\n  }\n  function apply() {\n    var r = document.documentElement.style;\n    var h = P.glowColor, c = [1, 3, 5].map(function (k) { return parseInt(h.substr(k, 2), 16); }).join(',');\n    r.setProperty('--glow', 'rgba(' + c + ',0.85)');\n    r.setProperty('--glow2', 'rgba(' + c + ',0.35)');\n    r.setProperty('--glow0', 'rgba(' + c + ',0)');\n    r.setProperty('--radius', P.radius + 'px');\n    r.setProperty('--dur', P.dur + 's');\n    r.setProperty('--bright', P.bright);\n    r.setProperty('--fs', P.fontSize + 'px');\n    r.setProperty('--panel', P.panel);\n  }\n  apply(); fit();\n  window.addEventListener('resize', fit);\n  onParams(apply);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "75": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>빛나는 물결\u003c/title>\n\u003cstyle>\nhtml,body{margin:0;height:100%;overflow:hidden;background:var(--t-bg)}\ncanvas{display:block;width:100vw;height:100vh}\n.hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;font:500 13px -apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Noto Sans KR\",sans-serif;color:var(--t-muted);pointer-events:none;transition:opacity .6s}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"c\">\u003c/canvas>\n\u003cdiv class=\"hint\" id=\"hint\">커서를 위아래로 움직여 보세요\u003c/div>\n\u003cscript>\nconst P = PARAMS({ ampTop: 80, ampBottom: 20, follow: 4, gap: 26, speedMul: 1, outerBlur: 24, coreBlur: 10 });\nconst cv=document.getElementById('c');\nconst ctx=cv.getContext('2d');\nconst hint=document.getElementById('hint');\nlet W,H,dpr;\nlet A=50,At=50,t=0,lastR=null;\nconst lines=[\n  {k:2*Math.PI/300,w:1.5,ph:0,off:-26,lw:2.4},\n  {k:2*Math.PI/380,w:1.1,ph:2,off:0,lw:3},\n  {k:2*Math.PI/240,w:1.9,ph:4,off:26,lw:2}\n];\n/* 팔레트: 어두운 테마는 밝은 네온(라벤더·하늘·연보라)을 lighter로 겹치고, 밝은 테마는 진한 남보라·하늘·인디고를 일반 합성으로 */\nconst NEON={dark:['251,227,154','90,169,255','206,201,255'],light:['246,201,69','90,169,255','138,106,20']};\nlet BG0,BG1,DARK;\nfunction readTheme(){DARK=THEME()==='dark';BG0=T('surface');BG1=T('bg');const c=NEON[DARK?'dark':'light'];lines.forEach((L,i)=>L.col=c[i]);}\nreadTheme();onTheme(readTheme);\nfunction resize(){\n  W=window.innerWidth;H=window.innerHeight;\n  dpr=Math.min(window.devicePixelRatio||1,2);\n  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);\n  ctx.setTransform(dpr,0,0,dpr,0,0);\n}\nwindow.addEventListener('resize',resize);\nresize();\nwindow.addEventListener('pointermove',e=>{\n  const r=Math.max(0,Math.min(1,e.clientY/H));\n  lastR=r;\n  At=P.ampTop-r*(P.ampTop-P.ampBottom);\n  hint.style.opacity=0;\n});\nfunction wavePath(L){\n  ctx.beginPath();\n  const cy=H/2+Math.sign(L.off)*P.gap;\n  for(let x=-10;x\u003c=W+10;x+=4){\n    const y=cy+A*(0.78*Math.sin(L.k*x+L.w*t+L.ph)+0.22*Math.sin(2.1*L.k*x+1.6*L.w*t+L.ph*1.3));\n    if(x===-10)ctx.moveTo(x,y);else ctx.lineTo(x,y);\n  }\n}\nlet prev=performance.now();\nfunction frame(now){\n  const dt=Math.min(0.05,(now-prev)/1000);prev=now;\n  t+=dt*P.speedMul;\n  A+=(At-A)*Math.min(1,dt*P.follow);\n  const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);\n  bg.addColorStop(0,BG0);bg.addColorStop(1,BG1);\n  ctx.globalCompositeOperation='source-over';\n  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);\n  ctx.globalCompositeOperation=DARK?'lighter':'source-over';\n  ctx.lineCap='round';ctx.lineJoin='round';\n  for(const L of lines){\n    wavePath(L);\n    ctx.shadowColor='rgba('+L.col+',1)';\n    ctx.shadowBlur=P.outerBlur;\n    ctx.strokeStyle='rgba('+L.col+','+(DARK?.28:.18)+')';\n    ctx.lineWidth=L.lw*3;\n    ctx.stroke();\n    ctx.shadowBlur=P.coreBlur;\n    ctx.shadowColor='rgba('+L.col+','+(DARK?1:.55)+')';\n    ctx.strokeStyle='rgba('+L.col+',.95)';\n    ctx.lineWidth=L.lw;\n    ctx.stroke();\n  }\n  ctx.shadowBlur=0;\n  requestAnimationFrame(frame);\n}\nrequestAnimationFrame(frame);\nonParams(()=>{if(lastR!==null)At=P.ampTop-lastR*(P.ampTop-P.ampBottom);});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "76": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>유리 공 렌즈\u003c/title>\n\u003cstyle>\n  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--t-bg); cursor: none; touch-action: none; }\n  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }\n  #ball {\n    position: fixed; left: 0; top: 0;\n    width: 200px; height: 200px; border-radius: 50%;\n    pointer-events: none; will-change: transform;\n    box-shadow: 0 18px 40px rgba(0,0,0,.28), 0 4px 10px rgba(0,0,0,.18);\n  }\n  #lens { width: 200px; height: 200px; border-radius: 50%; display: block; }\n  /* 유리 표면: 가장자리 어둡게 + 위쪽 하이라이트 */\n  #ball::before, #ball::after { content: \"\"; position: absolute; inset: 0; border-radius: 50%; }\n  #ball::before {\n    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 62%, rgba(20,30,50,.18) 86%, rgba(20,30,50,.38) 100%);\n    box-shadow: inset 0 0 0 1px rgba(255,255,255,.55);\n  }\n  #ball::after {\n    background:\n      radial-gradient(ellipse 34% 20% at 36% 22%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%),\n      radial-gradient(ellipse 22% 10% at 66% 86%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%);\n  }\n  #hint {\n    position: fixed; left: 16px; bottom: 16px; margin: 0;\n    font: 13px/1.4 -apple-system, \"Apple SD Gothic Neo\", sans-serif; color: var(--t-ink);\n    background: color-mix(in srgb, var(--t-surface) 85%, transparent); padding: 6px 10px; border-radius: 6px;\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cdiv id=\"ball\">\u003ccanvas id=\"lens\">\u003c/canvas>\u003c/div>\n\u003cp id=\"hint\">커서를 움직여 보세요 · 공 안 배율 \u003cspan id=\"magt\">1.4\u003c/span>배\u003c/p>\n\n\u003cscript>\nconst P = PARAMS({ diameter: 200, mag: 1.4, bulge: 0.35, follow: 22, band: 22 });\n(() => {\n  let DIAMETER = P.diameter;\n  let MAG = P.mag;\n  let BULGE = P.bulge;\n\n  const bg = document.getElementById('bg');\n  const bctx = bg.getContext('2d');\n  const lens = document.getElementById('lens');\n  const lctx = lens.getContext('2d');\n  const ball = document.getElementById('ball');\n\n  let dpr = 1, W = 0, H = 0, bgData = null, out = null, map = null;\n\n  // 줄무늬 배경 그리기\n  function drawBackground() {\n    DIAMETER = P.diameter; MAG = P.mag; BULGE = P.bulge;\n    ball.style.width = ball.style.height = DIAMETER + 'px';\n    lens.style.width = lens.style.height = DIAMETER + 'px';\n    document.getElementById('magt').textContent = String(+(+MAG).toFixed(2));\n    dpr = Math.min(window.devicePixelRatio || 1, 2);\n    W = Math.round(innerWidth * dpr);\n    H = Math.round(innerHeight * dpr);\n    bg.width = W; bg.height = H;\n\n    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    bctx.fillStyle = T('bg');\n    bctx.fillRect(0, 0, innerWidth, innerHeight);\n\n    // 대각선 줄무늬\n    const colors = ['#8a6a14', '#ff6f86', '#ff9f43', '#3cc8a0'];\n    const band = P.band;\n    bctx.save();\n    bctx.translate(innerWidth / 2, innerHeight / 2);\n    bctx.rotate(-Math.PI / 6);\n    const span = Math.hypot(innerWidth, innerHeight);\n    let i = 0;\n    for (let x = -span; x \u003c span; x += band * 2, i++) {\n      bctx.fillStyle = colors[i % colors.length];\n      bctx.fillRect(x, -span, band, span * 2);\n    }\n    bctx.restore();\n\n    // 가는 가로 줄무늬(휨이 잘 보이도록)\n    bctx.fillStyle = THEME() === 'dark' ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.12)';\n    for (let y = 0; y \u003c innerHeight; y += 30) bctx.fillRect(0, y, innerWidth, 2);\n\n    bgData = bctx.getImageData(0, 0, W, H).data;\n\n    // 렌즈 캔버스 준비 + 굴절 맵(픽셀별 원본 오프셋) 미리 계산\n    const S = Math.round(DIAMETER * dpr);\n    lens.width = S; lens.height = S;\n    out = lctx.createImageData(S, S);\n    map = new Float32Array(S * S * 2);\n    const R = S / 2;\n    for (let py = 0; py \u003c S; py++) {\n      for (let px = 0; px \u003c S; px++) {\n        const dx = px + 0.5 - R, dy = py + 0.5 - R;\n        const r = Math.hypot(dx, dy) / R;\n        const idx = (py * S + px) * 2;\n        if (r > 1) { map[idx] = NaN; continue; }\n        // 중심은 1/MAG 로 확대, 가장자리로 갈수록 구면처럼 더 압축(=더 휨)\n        const sphere = 1 - Math.sqrt(1 - r * r);\n        const s = (1 / MAG) * (1 - BULGE * sphere);\n        map[idx] = dx * s;\n        map[idx + 1] = dy * s;\n      }\n    }\n  }\n\n  // 배경에서 쌍선형 샘플링\n  function sample(x, y, o, d) {\n    if (x \u003c 0) x = 0; else if (x > W - 1.001) x = W - 1.001;\n    if (y \u003c 0) y = 0; else if (y > H - 1.001) y = H - 1.001;\n    const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;\n    const i00 = (y0 * W + x0) * 4, i10 = i00 + 4, i01 = i00 + W * 4, i11 = i01 + 4;\n    for (let c = 0; c \u003c 3; c++) {\n      const a = bgData[i00 + c] + (bgData[i10 + c] - bgData[i00 + c]) * fx;\n      const b = bgData[i01 + c] + (bgData[i11 + c] - bgData[i01 + c]) * fx;\n      d[o + c] = a + (b - a) * fy;\n    }\n    d[o + 3] = 255;\n  }\n\n  function renderLens(cx, cy) {\n    const S = lens.width, d = out.data;\n    const X = cx * dpr, Y = cy * dpr;\n    for (let i = 0, n = S * S; i \u003c n; i++) {\n      const mx = map[i * 2];\n      const o = i * 4;\n      if (mx !== mx) { d[o + 3] = 0; continue; }\n      sample(X + mx, Y + map[i * 2 + 1], o, d);\n    }\n    lctx.putImageData(out, 0, 0);\n  }\n\n  let tx = innerWidth / 2, ty = innerHeight / 2;\n  let x = tx, y = ty, lastX = -1, lastY = -1;\n\n  let touched = false;\n  addEventListener('pointermove', e => { touched = true; tx = e.clientX; ty = e.clientY; }, { passive: true });\n  addEventListener('pointerdown', e => { touched = true; tx = e.clientX; ty = e.clientY; }, { passive: true });\n  addEventListener('resize', () => { drawBackground(); lastX = -1; if (!touched) { x = 'c'),x=c.getContext('2d'),h=document.getElementById('h');\nconst D=Math.min(2,devicePixelRatio||1),paper=document.createElement('canvas');\nlet W,H;\n/* 종이 = 배경색, 결·얼룩 = 글자색 계열 / 먹 = 밝은 테마는 글자색(곱하기), 어두운 테마는 라벤더 빛 먹(스크린) */\nlet DARK=false,INK='27,26,36',GR='108,106,122';\nfunction hexRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)).join(',')}\nfunction readTheme(){DARK=THEME()==='dark';INK=DARK?'251,227,154':hexRgb(T('ink'));GR=hexRgb(T('muted'))}\nreadTheme();\nfunction makePaper(){paper.width=W*D;paper.height=H*D;const p=paper.getContext('2d');p.setTransform(D,0,0,D,0,0);p.fillStyle=T('bg');p.fillRect(0,0,W,H);\nfor(let i=0;i\u003cW*H/16;i++){const a=Math.random()*.05;p.fillStyle=Math.random()\u003c.5?`rgba(${GR},${a})`:`rgba(255,255,255,${a*(DARK?.5:1.6)})`;p.fillRect(Math.random()*W,Math.random()*H,1,1)}\np.lineWidth=.6;for(let i=0;i\u003c160;i++){const sx=Math.random()*W,sy=Math.random()*H,a=Math.random()*6.28,l=6+Math.random()*16;p.strokeStyle=`rgba(${GR},${.04+Math.random()*.05})`;p.beginPath();p.moveTo(sx,sy);p.quadraticCurveTo(sx+Math.cos(a+.5)*l*.5,sy+Math.sin(a+.5)*l*.5,sx+Math.cos(a)*l,sy+Math.sin(a)*l);p.stroke()}\nconst g=p.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,DARK?'rgba(0,0,0,.25)':`rgba(${GR},.13)`);p.fillStyle=g;p.fillRect(0,0,W,H)}\nfunction size(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0);makePaper()}\nsize();addEventListener('resize',size);\nonTheme(()=>{readTheme();makePaper()});\nconst drops=[],FALL=200;\nc.addEventListener('pointerdown',e=>{h.style.opacity=0;const blobs=[],tend=[];const n=9+(Math.random()*5|0);\nfor(let i=0;i\u003cn;i++){const d=.1+Math.random()*.34;blobs.push({a:Math.random()*6.283,d,s:.95-d-Math.random()*.12,w:.55+Math.random()*.45,ph:Math.random()*6.283})}\nfor(let i=0;i\u003c8;i++){tend.push({a:Math.random()*6.283,d:.6+Math.rando {dragging=true;sx=e.clientX-ox;sy=e.clientY-oy;tx=ox;ty=oy;c.setPointerCapture(e.pointerId);c.classList.add('drag');hint.style.opacity=0;}});\nc.addEventListener('pointermove',e=>{if(!dragging)return;let dx=e.clientX-sx,dy=e.clientY-sy;const m=Math.hypot(dx,dy),L=R*0.9;if(m>L){dx*=L/m;dy*=L/m}tx=dx;ty=dy;});\nfunction up(){if(!dragging)return;dragging=false;c.classList.remove('drag');}\nc.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);\nfunction step(dt){\nconst pox=ox,poy=oy;\nif(dragging){const k=Math.min(1,dt*28);ox+=(tx-ox)*k;oy+=(ty-oy)*k;}\nelse{vx+=(-P.stiffness*ox-P.damping*vx)*dt;vy+=(-P.stiffness*oy-P.damping*vy)*dt;ox+=vx*dt;oy+=vy*dt;}\nconst gvx=(ox-pox)/dt,gvy=(oy-poy)/dt;\nif(dragging){vx=gvx;vy=gvy}\nlet dvx=gvx-pgvx(),dvy=gvy-pgvy();pgx=gvx;pgy=gvy;\nif(first){dvx=0;dvy=0;first=false}\nconst ix=-dvx/R*P.impulse,iy=-dvy/R*P.impulse,mag=Math.hypot(dvx,dvy)/R;\nfor(const f of fl){\nf.vx+=ix+(Math.random()-.5)*mag*0.9;\nf.vy+=iy+(Math.random()-.5)*mag*0.9;\nconst air=f.y\u003cfloorY(f.x)-0.005;\nf.vx+=(-P.airDrag*f.vx)*dt+(air?Math.sin(t*1.8+f.p)*0.35*dt:0);\nf.vy+=(P.gravity-P.airDrag*f.vy)*dt;\nconst s=Math.hypot(f.vx,f.vy);if(s>3.5){f.vx*=3.5/s;f.vy*=3.5/s}\nf.x+=f.vx*dt;f.y+=f.vy*dt;\nconst r=Math.hypot(f.x,f.y);\nif(r>LIM){const nx=f.x/r,ny=f.y/r;f.x=nx*LIM;f.y=ny*LIM;const vn=f.vx*nx+f.vy*ny;if(vn>0){f.vx-=(1+P.bounce)*vn*nx;f.vy-=(1+P.bounce)*vn*ny}}\nconst fy=floorY(f.x);\nif(f.y>fy){f.y=fy;if(f.vy>0)f.vy=0;f.vx*=Math.pow(0.01,dt)}\n}\n}\nfunction pgvx(){return pgx}function pgvy(){return pgy}\nfunction tree(u,h){const fx=CX+ox+u*R,fy=CY+oy+(floorY(u)+0.02)*R;x.fillStyle='#5a3a24';x.fillRect(fx-R*0.015,fy-R*0.06,R*0.03,R*0.06);\nfor(let i=0;i\u003c3;i++){const w=R*(0.15-i*0.035),y0=fy-R*0.05-i*R*h*0.28;x.fillStyle=i%2?'#2f6b4f':'#265a43';x.beginPath();x.moveTo(fx-w,y0);x.lineTo(fx+w,y0);x.lineTo(fx,y0-R*h*0.42);x.closePath();x.fill();\nx.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.moveTo(fx-w*0.35,y0-R*h*0.26);x.lineTo(fx,y0-R*h*0.42);x.lineTo(fx+w*0.35,y0-R*h*0.26);x.closePath();x.fill();}}\nfunction house(u){const fx=CX+ox+u*R,fy=CY+oy+(floorY(u)+0.01)*R,w=R*0.26,h=R*0.17;\nx.fillStyle='#b5523b';x.fillRect(fx-w/2,fy-h,w,h);\nx.fillStyle='#7c2f22';x.beginPath();x.moveTo(fx-w*0.62,fy-h);x.lineTo(fx,fy-h-R*0.14);x.lineTo(fx+w*0.62,fy-h);x.closePath();x.fill();\nx.fillStyle='#f4f7ff';x.beginPath();x.moveTo(fx-w*0.66,fy-h+R*0.005);x.lineTo(fx,fy-h-R*0.15);x.lineTo(fx+w*0.66,fy-h+R*0.005);x.lineTo(fx+w*0.5,fy-h+R*0.02);x.lineTo(fx,fy-h-R*0.11);x.lineTo(fx-w*0.5,fy-h+R*0.02);x.closePath();x.fill();\nx.fillStyle='#ffd982';x.fillRect(fx-w*0.32,fy-h*0.68,w*0.2,h*0.3);x.fillRect(fx+w*0.12,fy-h*0.68,w*0.2,h*0.3);\nx.fillStyle='#4a2216';x.fillRect(fx-w*0.08,fy-h*0.5,w*0.16,h*0.5);}\nfunction draw(){\nx.clearRect(0,0,W,H);\nconst gx=CX+ox,gy=CY+oy;\nx.fillStyle=THEME()==='dark'?'rgba(0,0,0,.4)':'rgba(30,24,70,.22)';x.beginPath();x.ellipse(CX+ox*0.3,CY+R*1.2,R*0.95,R*0.09,0,0,Math.PI*2);x.fill();\nx.save();x.beginPath();x.arc(gx,gy,R,0,Math.PI*2);x.clip();\nconst bg=x.createRadialGradient(gx-R*0.3,gy-R*0.4,R*0.1,gx,gy,R);bg.addColorStop(0,'#5d82b8');bg.addColorStop(1,'#1e2f52');x.fillStyle=bg;x.fillRect(gx-R,gy-R,R*2,R*2);\ntree(-0.5,0.5);tree(0.58,0.42);tree(-0.25,0.32);house(0.12);\nx.fillStyle='#eef3fb';x.beginPath();x.moveTo(gx-R,gy+R);for(let u=-1;u\u003c=1.001;u+=0.05){x.lineTo(gx+u*R,gy+(floorY(u)+0.02)*R)}x.lineTo(gx+R,gy+R);x.closePath();x.fill();\nx.fillStyle='rgba(180,200,230,.35)';x.beginPath();x.ellipse(gx,gy+R*0.62,R*0.7,R*0.05,0,0,Math.PI*2);x.fill();\nfor(const f of fl){x.fillStyle='rgba(255,255,255,'+f.a+')';x.beginPath();x.arc(gx+f.x*R,gy+f.y*R,f.r,0,Math.PI*2);x.fill();}\nconst sh=x.createRadialGradient(gx,gy,R*0.7,gx,gy,R);sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(200,225,255,.28)');x.fillStyle=sh;x.fillRect(gx-R,gy-R,R*2,R*2);\nx.restore();\nx.strokeStyle='rgba(220,235,255,.45)';x.lineWidth=2;x.beginPath();x.arc(gx,gy,R,0,Math.PI*2);x.stroke();\nx.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=R*0.06;x.lineCap='round';x.beginPath();x.arc(gx,gy,R*0.82,Math.PI*1.12,Math.PI*1.38);x.stroke();\nx.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.ellipse(gx+R*0.45,gy-R*0.5,R*0.05,R*0.03,-0.7,0,Math.PI*2);x.fill();\nconst by=gy+R*0.74,tw=R*0.68,bw=R*0.82,bh=R*0.42;\nconst bgd=x.createLinearGradient(0,by,0,by+bh);bgd.addColorStop(0,'#8a5733');bgd.addColorStop(1,'#4b2a15');\nx.fillStyle=bgd;x.beginPath();x.moveTo(gx-tw,by);x.lineTo(gx+tw,by);x.lineTo(gx+bw,by+bh);x.lineTo(gx-bw,by+bh);x.closePath();x.fill();\nx.fillStyle='#c79a5a';x.fillRect(gx-tw-R*0.02,by,tw*2+R*0.04,R*0.05);\nx.fillStyle='rgba(255,255,255,.12)';x.beginPath();x.moveTo(gx-tw*0.8,by+R*0.08);x.lineTo(gx-tw*0.55,by+R*0.08);x.lineTo(gx-bw*0.6,by+bh-R*0.03);x.lineTo(gx-bw*0.85,by+bh-R*0.03);x.closePath();x.fill();\n}\nfunction loop(now){const dt=Math.min(0.033,Math.max(0.001,(now-last)/1000));last=now;t+=dt;step(dt);draw();requestAnimationFrame(loop)}\nrequestAnimationFrame(loop);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "87": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>글자 속 사진\u003c/title>\n\u003cstyle>\nhtml,body{margin:0;background:var(--t-bg);height:100%;overflow:hidden}\n#pg{will-change:transform}\nbody{font-family:-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Noto Sans KR\",sans-serif}\n.top{height:56px;display:flex;align-items:center;justify-content:center;color:var(--t-muted);font-size:13px;letter-spacing:.04em}\n.word{margin:0;padding:0 0 .04em;text-align:center;font-family:\"Arial Black\",\"Helvetica Neue\",Arial,sans-serif;font-weight:900;font-size:21.5vw;line-height:.86;letter-spacing:-.03em;color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-repeat:no-repeat;background-color:#222}\n.foot{height:220px;display:flex;align-items:center;justify-content:center;color:var(--t-muted);font-size:12px;letter-spacing:.3em}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"pg\">\n\u003cdiv class=\"top\">이 창 위에서 스크롤해 보세요\u003c/div>\n\u003ch1 class=\"word\" id=\"w\">OCEAN\u003cbr>DRIFT\u003cbr>LIGHT\u003cbr>WAVES\u003cbr>SHORE\u003cbr>DREAM\u003c/h1>\n\u003cdiv class=\"foot\">SUMMER ISSUE\u003c/div>\n\u003c/div>\n\u003cscript>\nconst P = PARAMS({ startAt: 65, endAt: -15, speed: 0.3, fontSize: 21.5, lineH: 0.86, stars: 140 });\nconst w=document.getElementById('w'),pg=document.getElementById('pg');\nlet maxS=0,imgH=0;\nfunction rnd(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}}\nfunction paint(cw,ch){\nconst cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const g=cv.getContext('2d');const r=rnd(7);\nconst hz=ch*0.52;\nconst sky=g.createLinearGradient(0,0,0,hz);sky.addColorStop(0,'#141f5c');sky.addColorStop(.3,'#4b2f8f');sky.addColorStop(.62,'#e0508a');sky.addColorStop(.85,'#ff8e5e');sky.addColorStop(1,'#ffc46b');\ng.fillStyle=sky;g.fillRect(0,0,cw,hz);\nfor(let i=0;i\u003cP.stars;i++){g.fillStyle='rgba(255,255,255,'+(0.3+r()*0.6)+')';const s=r()*2+0.6;g.fillRect(r()*cw,r()*hz*0.4,s,s)}\nconst sx=cw*0.6,sy=hz-ch*0.02,sr=cw*0.15;\nconst glow=g.createRadialGradient(sx,sy,sr*0.2,sx,sy,sr*3);glow.addColorStop(0,'rgba(255,235,160,.9)');glow.addColorStop(1,'rgba(255,180,110,0)');g.fillStyle=glow;g.fillRect(0,0,cw,hz);\ng.fillStyle='#fff1b8';g.beginPath();g.arc(sx,sy,sr,0,Math.PI*2);g.fill();\nfor(let i=0;i\u003c9;i++){const cy=hz*(0.3+r()*0.55),cx=r()*cw,cwid=cw*(0.18+r()*0.3);g.fillStyle='rgba(255,'+(140+r()*80|0)+','+(150+r()*60|0)+',.35)';g.beginPath();g.ellipse(cx,cy,cwid,cwid*0.08,0,0,Math.PI*2);g.fill();}\nfunction ridge(base,amp,col,seed){const q=rnd(seed);g.fillStyle=col;g.beginPath();g.moveTo(0,hz);let y=base;for(let xx=0;xx\u003c=cw;xx+=cw/24){y=base-q()*amp;g.lineTo(xx,y)}g.lineTo(cw,hz);g.closePath();g.fill();}\nridge(hz-ch*0.02,ch*0.09,'#7a3a7e',3);ridge(hz,ch*0.06,'#4a2462',11);\nconst sea=g.createLinearGradient(0,hz,0,ch*0.86);sea.addColorStop(0,'#ff9b6a');sea.addColorStop(.25,'#b45486');sea.addColorStop(.6,'#2e4a96');sea.addColorStop(1,'#0f2a5c');\ng.fillStyle=sea;g.fillRect(0,hz,cw,ch*0.86-hz);\nfor(let i=0;i\u003c70;i++){const yy=hz+Math.pow(r(),1.6)*(ch*0.86-hz),spread=cw*(0.05+(yy-hz)/ch*0.6),len=cw*(0.03+r()*0.12);const xx=sx+(r()-.5)*spread*2;g.fillStyle='rgba(255,226,160,'+(0.25+r()*0.5)+')';g.fillRect(xx-len/2,yy,len,1.5+r()*2.5)}\nfor(let i=0;i\u003c40;i++){const yy=hz+r()*(ch*0.86-hz);g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=1.5;g.beginPath();g.moveTo(r()*cw,yy);g.lineTo(r()*cw,yy+1);g.stroke()}\nconst sand=g.createLinearGradient(0,ch*0.86,0,ch);sand.addColorStop(0,'#f4c98f');sand.addColorStop(1,'#c98a52');\ng.fillStyle=sand;g.beginPath();g.moveTo(0,ch*0.88);for(let xx=0;xx\u003c=cw;xx+=cw/12){g.lineTo(xx,ch*0.86+Math.sin(xx/cw*6)*ch*0.012)}g.lineTo(cw,ch);g.lineTo(0,ch);g.closePath();g.fill();\ng.fillStyle='rgba(255,255,255,.7)';g.beginPath();for(let xx=0;xx\u003c=cw;xx+=cw/12){g.lineTo(xx,ch*0.86+Math.sin(xx/cw*6)*ch*0.012)}g.lineTo(cw,ch*0.87);g.lineTo(0,ch*0.875);g.closePath();g.fill();\nfor(let i=0;i\u003c300;i++){g.fillStyle='rgba(120,70,30,'+(r()*0.3)+')';g.fillRect(r()*cw,ch*0.87+r()*ch*0.13,2,2)}\ng.strokeStyle='rgba(30,20,50,.7)';g.lineWidth=2;for(let i=0;i\u003c7;i++){const bx=cw*(0.15+r()*0.35),by=hz*(0.35+r()*0.4),bs=6+r()*8;g.beginPath();g.moveTo(bx-bs,by-bs*0.4);g.quadraticCurveTo(bx-bs*0.4,by-bs*0.6,bx,by);g.quadraticCurveTo(bx+bs*0.4,by-bs*0.6,bx+bs,by-bs*0.4);g.stroke()}\nreturn cv.toDataURL('image/jpeg',0.9);\n}\nfunction style(){w.style.fontSize=P.fontSize+'vw';w.style.lineHeight=P.lineH;}\nfunction setup(){\nstyle();\nmaxS=Math.max(0,pg.offsetHeight-innerHeight);\nconst cw=w.offsetWidth,eh=w.offsetHeight;imgH=Math.ceil(eh+maxS*P.speed)+4;\nw.style.backgroundImage='url('+paint(cw,imgH)+')';\nw.style.backgroundSize=cw+'px '+imgH+'px';\nupdate();\n}\n/* 이 창 위에서 스크롤 진행도로 이 창 안의 내용을 가상 스크롤 */\nfunction update(){const s=hostProgress(HOST(),P.startAt/100,P.endAt/100)*maxS;pg.style.transform='translateY('+(-s)+'px)';w.style.backgroundPosition='0px '+(-maxS*P.speed+s*P.speed)+'px';}\nonHost(update);\nlet rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(setup,150)});\nsetup();\nonParams(()=>{clearTimeout(rt);setup();});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "88": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>주황 판 와이프 전환\u003c/title>\n\u003cstyle>\n  :root { --wipe: #ff9f43; }\n  * { box-sizing: border-box; margin: 0; }\n  html, body { height: 100%; }\n  body {\n    font-family: -apple-system, BlinkMacSystemFont, \"Apple SD Gothic Neo\", \"Pretendard\", sans-serif;\n    word-break: keep-all; overflow-wrap: break-word;\n    background: var(--t-bg); color: #fff; overflow: hidden;\n  }\n  .stage { position: fixed; inset: 0; overflow: hidden; }\n  .scene {\n    position: absolute; inset: 0;\n    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;\n    visibility: hidden;\n  }\n  .scene.active { visibility: visible; }\n  .scene h1 { font-size: clamp(40px, 8vw, 96px); font-weight: 800; }\n  .scene p { font-size: 18px; opacity: .75; }\n  .s1 { background: #8a6a14; }\n  .s2 { background: #3cc8a0; color: #111111; }\n  .s3 { background: #fbe39a; color: #111111; }\n\n  /* 색 판: 기본은 화면 오른쪽 바깥에 대기 */\n  .wipe {\n    position: absolute; inset: 0; background: var(--wipe);\n    transform: translateX(100%); z-index: 10; pointer-events: none;\n    will-change: transform;\n  }\n\n  .next {\n    position: fixed; right: 24px; bottom: 24px; z-index: 20;\n    padding: 14px 28px; font-size: 17px; font-weight: 700;\n    border: 0; border-radius: 999px; background: var(--t-surface); color: var(--t-ink); cursor: pointer;\n    box-shadow: 0 6px 18px rgba(20,16,50,.22);\n  }\n  .next:disabled { opacity: var(--dim, .5); cursor: default; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003csection class=\"scene s1 active\">\u003ch1>장면 1\u003c/h1>\u003cp>다음 버튼을 누르세요\u003c/p>\u003c/section>\n  \u003csection class=\"scene s2\">\u003ch1>장면 2\u003c/h1>\u003cp>색 판이 지나간 뒤 보이는 화면\u003c/p>\u003c/section>\n  \u003csection class=\"scene s3\">\u003ch1>장면 3\u003c/h1>\u003cp>마지막 장면 · 다음을 누르면 처음으로\u003c/p>\u003c/section>\n  \u003cdiv class=\"wipe\" id=\"wipe\">\u003c/div>\n\u003c/div>\n\u003cbutton class=\"next\" id=\"next\">다음 →\u003c/button>\n\n\u003cscript>\n  const P = PARAMS({ dur: 0.4, ease: \"cubic-bezier(.7,0,.3,1)\", wipeColor: \"#ff9f43\", dim: 0.5 });\n  const scenes = [...document.querySelectorAll('.scene')];\n  const wipe = document.getElementById('wipe');\n  const btn = document.getElementById('next');\n  let idx = 0, busy = false;\n\n  btn.addEventListener('click', async () => {\n    if (busy) return;\n    busy = true; btn.disabled = true;\n\n    // 1) 덮기: 오른쪽(100%) → 화면 전체(0) , 0.4초\n    await wipe.animate(\n      [{ transform: 'translateX(100%)' }, { transform: 'translateX(0)' }],\n      { duration: P.dur * 1000, easing: P.ease, fill: 'forwards' }\n    ).finished;\n\n    // 2) 화면이 완전히 덮인 순간 장면 교체\n    scenes[idx].classList.remove('active');\n    idx = (idx + 1) % scenes.length;\n    scenes[idx].classList.add('active');\n\n    // 3) 빠지기: 화면(0) → 왼쪽 바깥(-100%), 0.4초 — 지나간 자리에 다음 장면이 드러남\n    await wipe.animate(\n      [{ transform: 'translateX(0)' }, { transform: 'translateX(-100%)' }],\n      { duration: P.dur * 1000, easing: P.ease, fill: 'forwards' }\n    ).finished;\n\n    // 다음 전환을 위해 오른쪽 대기 위치로 복귀\n    wipe.getAnimations().forEach(a => a.cancel());\n    busy = false; btn.disabled = false;\n  });\n  function paint(){ document.documentElement.style.setProperty('--wipe', P.wipeColor); document.documentElement.style.setProperty('--dim', P.dim); }\n  paint();\n  onParams(paint);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "89": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"libs\" content=\"\">\n\u003ctitle>잡지 넘기기\u003c/title>\n\u003cstyle>\nhtml,body{margin:0;height:100%;overflow:hidden;background:var(--t-soft);font-family:-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Noto Sans KR\",sans-serif;user-select:none;-webkit-user-select:none}\n.wrap{position:absolute;left:50%;top:50%;width:640px;height:390px;margin:-205px 0 0 -320px}\n.book{position:relative;width:640px;height:390px;perspective:2200px;touch-action:none}\n.book:before{content:\"\";position:absolute;inset:6px -4px -8px -4px;background:rgba(20,16,50,.2);filter:blur(10px);border-radius:4px}\n.page,.face{position:absolute;top:0;width:320px;height:390px;overflow:hidden;background:#fbf9f4}\n.pL{left:0;border-radius:3px 0 0 3px}\n.pR{left:320px;border-radius:0 3px 3px 0}\n.flip{position:absolute;top:0;left:320px;width:320px;height:390px;transform-style:preserve-3d;transform-origin:0 50%;z-index:5}\n.face{left:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}\n.back{transform:rotateY(180deg)}\n.sh{position:absolute;inset:0;pointer-events:none}\n.spineL{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to left,rgba(0,0,0,.14),rgba(0,0,0,0) 12%)}\n.spineR{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(0,0,0,.14),rgba(0,0,0,0) 12%)}\n.zone{position:absolute;right:0;top:0;width:70px;height:100%;z-index:9;cursor:grab}\n.zone:after{content:\"\";position:absolute;right:0;bottom:0;width:26px;height:26px;background:linear-gradient(135deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.08) 50%,rgba(255,255,255,.9) 62%,#e8e3d9 100%);border-radius:0 0 3px 0}\n.hint{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font- >\n\u003c/div>\n\u003c/div>\n\u003cscript>\nconst P = PARAMS({ thresh: 0.3, dur: 0.6, minDur: 0.14, shade: 0.35, gloss: 0.25, zoneW: 70 });\nconst $=id=>document.getElementById(id);\nconst book=$('book'),flip=$('flip'),wrap=$('wrap');\nconst PAL=[['#e94f37','#fff3ee'],['#1c3f60','#eef3f8'],['#2a9d8f','#eef8f6'],['#f4a261','#fff6ec'],['#6d597a','#f5f0f7'],['#264653','#eef3f4']];\nconst HL=['바다로 가는 길','오후의 빛','작은 도시 산책','천천히, 여름','새벽 시장','골목의 색','바람의 지도','창가의 식탁'];\nconst KK=['TRAVEL','STYLE','CITY','ESSAY','FOOD','COLOR','PEOPLE','HOME'];\nfunction sr(n){let s=(n*9301+49297)%233280;return()=>{s=(s*9301+49297)%233280;return s/233280}}\nfunction photo(n,h,extra){const r=sr(n+3);const hues=[['#ffcf91','#e9696b'],['#a1c4fd','#5b7fd1'],['#fbd3a5','#7fb5a8'],['#f6a6b2','#7a4f9a'],['#c3f0ca','#3c8f7a'],['#ffe29a','#f08a5d']][n%6];\nconst sx=20+r()*60,sy=20+r()*25;\nreturn `\u003cdiv class=\"ph\" style=\"height:${h}px;${extra||''};background:radial-gradient(circle at ${sx}% ${sy}%,rgba(255,250,220,.95) 0 9%,rgba(255,250,220,0) 10%),linear-gradient(${150+r()*20}deg,rgba(0,0,0,0) 58%,rgba(20,20,40,.28) 58%),linear-gradient(${200+r()*20}deg,rgba(0,0,0,0) 64%,rgba(20,20,40,.4) 64%),linear-gradient(${hues[0]},${hues[1]})\">\u003c/div>`}\nfunction bars(n,k,seed){const r=sr(seed);let s='';for(let i=0;i\u003ck;i++){const w=i==k-1?35+r()*35:82+r()*18;s+=`\u003ci style=\"width:${w}%\">\u003c/i>`}return `\u003cdiv class=\"tx\">${s}\u003c/div>`}\nfunction page(n){const d=n%6,c=PAL[(n>>1)%6],hl=HL[n%8],kk=KK[n%8],side=n%2?'r':'l';const fo=`\u003cdiv class=\"fo ${side}\">${String(n+1).padStart(2,'0')}\u003c/div>`;\nif(d==0)return `\u003cdiv class=\"pg\" style=\"background:${c[1]}\">\u003cdiv class=\"k\" style=\"color:${c[0]}\">${kk}\u003c/div>\u003cdiv class=\"h\">${hl}\u003c/div>${photo(n,140,'margin-bottom:14px')}${bars(n,7,n)}${fo}\u003c/div>`;\nif(d==1)return `\u003cdiv class=\"pg\" style=\"padding:0\">${photo(n,390,'position:absolute;inset:0')}\u003cdiv style=\"position:absolute;left:24px;right:24px;bottom:34px\">\u003cdiv class=\"k\" style=\"color:#fff\">${kk}\u003c/div>\u003cdiv class=\"big\">${hl}\u003c/div>\u003c/div>\u003cdiv class=\"fo ${side}\" style=\"color:rgba(255,255,255,.8)\">${String(n+1).padStart(2,'0')}\u003c/div>\u003c/div>`;\nif(d==2)return `\u003cdiv class=\"pg\">\u003cdiv class=\"q\" style=\"color:${c[0]}\">“\u003c/div>\u003cdiv class=\"qt\">${hl}에서 보낸 하루는 생각보다 길었다\u003c/div>\u003cdiv class=\"cols\">\u003cdiv>${bars(n,9,n+1)}\u003c/div>\u003cdiv>${bars(n,8,n+2)}\u003c/div>\u003c/div>${fo}\u003c/div>`;\nif(d==3)return `\u003cdiv class=\"pg\">\u003cdiv class=\"k\" style=\"color:${c[0]}\">${kk}\u003c/div>\u003cdiv class=\"h\">${hl}\u003c/div>\u003cdiv class=\"grid\">${photo(n,96)}${photo(n+1,96)}${photo(n+2,96)}${photo(n+4,96)}\u003c/div>${bars(n,3,n+5)}${fo}\u003c/div>`;\nif(d==4)return `\u003cdiv class=\"pg\" style=\"background:${c[0]}\">\u003cdiv class=\"k\" style=\"color:rgba(255,255,255,.8)\">${kk}\u003c/div>\u003cdiv class=\"big\" style=\"font-size:52px;margin:30px 0 26px\">${hl}\u003c/div>\u003cdiv class=\"tx\" style=\"opacity:.5\">${bars(n,6,n+7).replace('\u003cdiv class=\"tx\">','\u003cdiv>')}\u003c/div>${fo.replace('class=\"fo','style=\"color:rgba(255,255,255,.7)\" class=\"fo')}\u003c/div>`;\nreturn `\u003cdiv class=\"pg\" style=\"text-align:center\">\u003cdiv class=\"k\" style=\"color:${c[0]};margin-top:4px\">INTERVIEW\u003c/div>\u003cdiv class=\"circ\">${photo(n,150,'position:absolute;inset:0')}\u003c/div>\u003cdiv class=\"h\" style=\"font-size:20px\">${hl}을 만드는 사람\u003c/div>${bars(n,4,n+9)}${fo}\u003c/div>`;}\nlet idx=0,p=0,busy=false,drag=null,scale=1;\nfunction render(){$('Lc').innerHTML=page(2*idx);$('Fc').innerHTML=page(2*idx+1);$('Bc').innerHTML=page(2*idx+2);$('Uc').innerHTML=page(2*idx+3);setP(0)}\nfunction setP(v){p=v;const s=Math.sin(Math.PI*v);flip.style.transform=`rotateY(${-180*v}deg)`;\n$('Fs').style.background=`linear-gradient(to left,rgba(0,0,0,${P.shade*s}) 0%,rgba(0,0,0,0) 38%),linear-gradient(to ri
